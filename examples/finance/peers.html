    o += T(X.x, X.y + 30 * u, "$100 INVESTED IN EACH", { size: 22 * u, weight: 800, ls: 1.5 * u });
    const clock = `YEAR ${Math.min(Math.floor(year), Math.floor(span))}`;
    o += R(X.x + X.w - 200 * u, X.y, 200 * u, 44 * u, { fill: C.accent, sw: 2.5 * u }) + T(X.x + X.w - 100 * u, X.y + 32 * u, clock, { size: 28 * u, weight: 800, anchor: "middle", ls: 1 * u });
    o += L(X.x, top, X.x + X.w, top, { dash: `${10 * u} ${7 * u}`, sw: 2.5 * u });
    o += L(X.x, base, X.x + X.w, base, { sw: 3 * u });
    TK.forEach((t, i) => {
      const cx = slotX(X, i), x0 = cx - cw / 2, v = t.m[key];
      if (v == null) {
        o += R(x0, top, cw, colH, { dash: `${8 * u} ${6 * u}`, stroke: C.muted, sw: 2 * u });
        o += R(cx - cw / 2 - 30 * u, top + colH / 2 - 44 * u, cw + 60 * u, 140 * u, { fill: C.bg, stroke: false });
        o += TB(`losing:${t.symbol}`, [[cx, top + colH / 2 - 8 * u, "LOSING", { size: 26 * u, weight: 800, anchor: "middle", fill: C.loss }], [cx, top + colH / 2 + 22 * u, "MONEY", { size: 26 * u, weight: 800, anchor: "middle", fill: C.loss }],
          [cx, top + colH / 2 + 56 * u, "no payback", { size: 20 * u, anchor: "middle", fill: C.muted }], [cx, top + colH / 2 + 80 * u, "at these earnings", { size: 20 * u, anchor: "middle", fill: C.muted }]]);
      } else {
        const slab = colH / v, filled = Math.min(year, v);
        o += Z(`coins:${t.symbol}`, x0, base - filled * slab, x0 + cw, base);
        if (slab >= 7 * u) {
          for (let j = 0; j < Math.ceil(filled - 1e-9); j++) {
            const hgt = Math.min(1, filled - j) * slab, y = base - j * slab - hgt;
            o += R(x0, y + 0.75 * u, cw, hgt - 1.5 * u, { fill: t.color, rx: Math.min(hgt * 0.35, 9 * u), sw: 2 * u });
          }
        } else {
          o += R(x0, base - filled * slab, cw, filled * slab, { fill: t.color, sw: 2 * u });
          for (let j = 5; j < filled; j += 5) o += L(x0, base - j * slab, x0 + cw, base - j * slab, { sw: 1.4 * u, op: 0.6 });
        }
        if (year >= v) o += T(cx, top - 14 * u, `${yrs(v)} YEARS`, { size: 26 * u, weight: 800, anchor: "middle" });
        else if (pl >= 1 && v > span) o += T(cx, base - filled * slab - 14 * u, `↑ ${yrs(v)} yrs`, { size: 22 * u, weight: 700, anchor: "middle", fill: C.muted });
      }
      const g = t.m.payback_growth, gi = t.inputs.growth;
      o += TB(`label:${t.symbol}`, [[cx, base + 44 * u, t.symbol, { size: 38 * u, weight: 800, anchor: "middle", stretch: "85%" }], [cx, base + 76 * u, `P/E ${mult(v)}`, { size: 24 * u, weight: 600, anchor: "middle" }],
        b.growth && [cx, base + 104 * u, g != null && gi != null ? `${yrs(g)} yrs at +${Math.round(gi * 100)}%/yr` : "growth n/a", { size: 19 * u, anchor: "middle", fill: C.muted }]]);
    });
    const note = `${b.basis === "fwd" ? "Forward (next 12 months, estimated)" : "Trailing 12-month"} earnings per share, held flat.${b.growth ? " Small print: years if earnings grow at the estimate." : ""}`;
    o += T(X.x, X.y + X.h - 4 * u, note, { size: 19 * u, fill: C.muted });
    return o;
  }

  // Market value as a building on one shared scale; each floor is one year of net income (the rent).
  function building(b, p, pl, X) {
    const max = Math.max(...TK.map((t) => t.m.mcap || 0));
    const labH = 132 * u, base = X.y + X.h - labH, avail = base - (X.y + 96 * u);
    const bw = Math.min((X.w / N) * 0.6, 200 * u);
    let o = "", sparse = 1;
    o += legend(X.x, X.y + 27 * u, [{ label: "= one floor = one year of profit (the rent)", sw: (x, y, w, h) => R(x, y, w, h, { fill: C.accent, sw: 2 * u, name: "swatch" }) }], 21 * u);
    TK.forEach((t, i) => {
      const cx = slotX(X, i), x0 = cx - bw / 2, mc = t.m.mcap || 0, ni = t.inputs.net_income;
      const hFull = Math.max(2 * u, (avail * mc) / max), h = hFull * ease(stag(p, i, N, 0.3));
      if (t.m.floors) {
        const fh = hFull / t.m.floors, step = fh >= 5 * u ? 1 : Math.ceil((5 * u) / fh);
        sparse = Math.max(sparse, step);
        o += R(x0, base - h, bw, h, { fill: C.surface, sw: 2.5 * u, name: `building:${t.symbol}` });
        o += R(x0, base - Math.min(fh, h), bw, Math.min(fh, h), { fill: C.accent, sw: 2 * u });
        for (let f = step; f < t.m.floors; f += step) { const y = base - f * fh; if (y > base - h + 1) o += L(x0, y, x0 + bw, y, { sw: 1.2 * u, op: 0.55 }); }
        o += R(x0, base - h, bw, h, { sw: 2.5 * u });
      } else {
        o += R(x0, base - h, bw, h, { fill: C.surface, dash: `${8 * u} ${6 * u}`, sw: 2.5 * u, name: `building:${t.symbol}` });
      }
      o += R(x0 - 6 * u, base - h - 7 * u, bw + 12 * u, 7 * u, { fill: t.color, sw: 2 * u, op: h > 3 * u ? 1 : 0 });
      o += T(cx, base - h - 20 * u, money(mc), { size: 28 * u, weight: 800, anchor: "middle", op: smooth(0.2, 0.6, stag(p, i, N, 0.3)) });
      o += TB(`label:${t.symbol}`, [[cx, base + 44 * u, t.symbol, { size: 38 * u, weight: 800, anchor: "middle", stretch: "85%" }],
        [cx, base + 74 * u, t.m.floors ? `${Math.round(t.m.floors)} floors` : "no rent", { size: 23 * u, weight: 600, anchor: "middle", fill: t.m.floors ? C.ink : C.loss }],
        ni != null && [cx, base + 100 * u, ni > 0 ? `rent ${money(ni)}/yr` : `lost ${money(-ni)}/yr`, { size: 19 * u, anchor: "middle", fill: C.muted }]]);
    });
    o += L(X.x, base, X.x + X.w, base, { sw: 3 * u });
    for (let x = X.x + 6 * u; x < X.x + X.w; x += 18 * u) o += L(x, base + 3 * u, x - 10 * u, base + 13 * u, { sw: 1.4 * u, stroke: C.muted });
    if (sparse > 1) o += T(X.x + X.w, X.y + 27 * u, `lines every ${sparse} floors where they'd blur`, { size: 18 * u, anchor: "end", fill: C.muted });
    return o;
  }

  // Yields as "what $100 of stock earns you per year": earned, free cash, paid out. Benchmark line for scale.
  function yields(b, p, pl, X) {
    const ek = b.basis === "fwd" ? "ey_fwd" : "ey_ttm";
    const kinds = [
      { k: ek, label: "earned", fill: (t) => t.color },
      { k: "fcf_yield", label: "free cash", fill: () => "url(#hatch)" },
      { k: "div_yield", label: "paid to you", fill: () => C.ink },
    ];
    const vals = TK.flatMap((t) => kinds.map((q) => t.m[q.k])).filter((v) => v != null).map((v) => v * 100);
    const bench = S.benchmark && S.benchmark.rate != null ? S.benchmark.rate * 100 : null;
    const vmax = Math.max(1, ...vals, bench || 0) * 1.08;
    const floor = -0.42 * vmax, vmin = Math.max(floor, Math.min(0, ...vals));
    const labW = 150 * u, valW = 210 * u, px0 = X.x + labW, pw = X.w - labW - valW;
    const x = (v) => px0 + ((clamp(v, vmin, vmax) - vmin) / (vmax - vmin)) * pw;
    const rowsTop = X.y + 100 * u, rowH = (X.h - 100 * u) / N, bh = Math.min(rowH * 0.17, 30 * u), gap = Math.max(bh * 0.45, 42 * u - bh); // stacked value labels stay a full pad apart
    let o = "";
    o += legend(X.x, X.y + 25 * u, kinds.map((q, j) => ({ label: ["earnings ÷ price", "free cash flow ÷ value", "dividend paid in cash"][j], sw: (x, y, w, h) => R(x, y, w, h, { fill: j === 0 ? C.accent : q.fill(TK[0]), sw: 2 * u, name: "swatch" }) })), 20 * u);
    const zx = x(0);
    o += L(zx, rowsTop - 14 * u, zx, X.y + X.h, { sw: 2.5 * u });
    if (bench != null) {
      const bx = x(bench);
      o += L(bx, rowsTop - 22 * u, bx, X.y + X.h, { stroke: C.muted, sw: 3 * u, dash: `${12 * u} ${8 * u}`, op: smooth(0.5, 0.8, p) });
      o += T(bx, rowsTop - 30 * u, `${S.benchmark.label}: ${money(bench)}`, { size: 21 * u, weight: 700, anchor: bx > X.x + X.w * 0.6 ? "end" : "middle", fill: C.muted, op: smooth(0.5, 0.8, p), knock: true });
    }
    TK.forEach((t, i) => {
      const y0 = rowsTop + i * rowH;
      o += TB(`label:${t.symbol}`, [[X.x, y0 + rowH * 0.42, t.symbol, { size: 36 * u, weight: 800, stretch: "85%" }], t.name && [X.x, y0 + rowH * 0.42 + 26 * u, fit(t.name, 18 * u, labW - 20 * u), { size: 18 * u, fill: C.muted }]]);
      kinds.forEach((q, j) => {
        const v = t.m[q.k] == null ? null : t.m[q.k] * 100, by = y0 + rowH * 0.1 + j * (bh + gap);
        const k = ease(stag(p, i * 3 + j, N * 3, 0.45));
        if (v == null) { o += T(zx + 10 * u, by + bh * 0.75, `${q.label}: n/a`, { size: 19 * u, fill: C.muted, op: k }); return; }
        const ve = v * k, xe = x(ve);
        const fill = v < 0 ? "url(#hatchLoss)" : q.fill(t);
        o += R(Math.min(zx, xe), by, Math.abs(xe - zx), bh, { fill, sw: 2 * u, name: `bar:${t.symbol}:${q.label}` });
        if (v < floor && k >= 1) o += zig(x(floor) + 14 * u, by, by + bh);
        const txt = v < 0 ? `${money(v)} (a loss)` : `${money(v)} ${q.label}`;
        o += T((v < 0 ? zx : xe) + 10 * u, by + bh * 0.78, txt, { size: 20 * u, weight: j === 0 ? 700 : 500, op: smooth(0.6, 1, k), fill: v < 0 ? C.loss : C.ink, knock: true });
      });
    });
    return o;
  }

  // Margins as a $100 strip of sales that gets trimmed: cost of goods, operating costs, then interest/tax/other.
  function margins(b, p, pl, X) {
    const st = (t) => { const m = t.m, a = [100]; for (const k of ["gross_margin", "op_margin", "net_margin"]) a.push(m[k] == null ? a[a.length - 1] : m[k] * 100); return a; };
    const lo = Math.max(-60, Math.min(0, ...TK.flatMap((t) => st(t))));
    const labW = 150 * u, px0 = X.x + labW, pw = X.w - labW - 150 * u;
    const x = (v) => px0 + ((clamp(v, lo, 100) - lo) / (100 - lo)) * pw;
    const rowsTop = X.y + 92 * u, rowH = (X.h - 92 * u) / N, sh = Math.min(rowH * 0.3, 60 * u);
    const s = clamp(pl * 1.02) * 3, si = Math.min(2, Math.floor(s)), fr = ease(clamp(s - si));
    const steps = ["cost of making it", "running the business", "interest, tax, other"];
    let o = "", lx = X.x;
    steps.forEach((name, j) => {
      const on = s > j ? 1 : 0.35;
      o += `<circle cx="${lx + 13 * u}" cy="${X.y + 18 * u}" r="${13 * u}" fill="${s > j ? C.accent : C.surface}" stroke="${C.ink}" stroke-width="${2 * u}"/>` + T(lx + 13 * u, X.y + 25 * u, String(j + 1), { size: 18 * u, weight: 800, anchor: "middle", name: `step ${j + 1}` });
      o += T(lx + 34 * u, X.y + 25 * u, name, { size: 20 * u, weight: 600, op: on });
      lx += 34 * u + tw(name, 20 * u) + 30 * u;
    });
    o += T(X.x, X.y + 62 * u, "Each strip starts as $100 of sales.", { size: 19 * u, fill: C.muted });
    const zx = x(0);
    TK.forEach((t, i) => {
      const a = st(t), cur = lerp(a[si], a[si + 1], fr), y0 = rowsTop + i * rowH, sy = y0 + rowH * 0.18;
      o += T(X.x, sy + sh * 0.72, t.symbol, { size: 36 * u, weight: 800, stretch: "85%" });
      o += R(zx, sy, x(100) - zx, sh, { fill: "url(#hatchRule)", dash: `${7 * u} ${5 * u}`, stroke: C.muted, sw: 1.6 * u, name: `strip:${t.symbol}` });
      if (cur >= 0) o += R(zx, sy, x(cur) - zx, sh, { fill: t.color, sw: 2.2 * u });
      else o += R(x(cur), sy, zx - x(cur), sh, { fill: "url(#hatchLoss)", sw: 2.2 * u });
      const lane = [0, 0, 0, 0];
      for (let j = 2; j <= 3; j++) if (Math.abs(x(a[j]) - x(a[j - 1])) < 34 * u && lane[j - 1] === 0) lane[j] = 1;
      for (let j = 1; j <= si + (fr > 0.98 ? 1 : 0) && j <= 3; j++) {
        const tx = x(a[j]), ly = sy - 18 * u - lane[j] * 34 * u;
        o += L(tx, ly + 6 * u, tx, sy + sh + 8 * u, { sw: 2 * u }) + T(tx, ly, String(j), { size: 16 * u, weight: 800, anchor: "middle", name: `tick ${j}:${t.symbol}` });
      }
      if (t.m.net_margin != null && t.m.net_margin < -0.6) o += zig(x(lo) + 10 * u, sy, sy + sh);
      const big = cur >= 0 ? `$${cur.toFixed(0)} kept` : `−$${(-cur).toFixed(0)} lost`;
      o += T(X.x + X.w, sy + sh * 0.68, big, { size: 26 * u, weight: 800, anchor: "end", fill: cur >= 0 ? C.ink : C.loss });
      const m = t.m;
      o += T(zx, sy + sh + 34 * u, `gross ${pct(m.gross_margin)} · operating ${pct(m.op_margin)} · net ${pct(m.net_margin)} · price ${mult(m.ps)} sales`, { size: 19 * u, fill: C.muted, op: smooth(0.85, 1, pl) });
    });
    return o;
  }

  // Pick each bubble label's side once, from the bubbles' final sizes: right, left, below, above, in that order,
  // taking the first spot that stays inside the plot and clear of every bubble and of labels already placed.
  function labelSides(geo, box) {
    const out = new Map(), taken = [];
    const hit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
    for (const g of geo.slice().sort((a, b) => b.R - a.R)) {
      const t = g.t, w = Math.max(tw(t.symbol, 28 * u, 800) * 0.9, tw(`P/E ${mult(t.m.pe_fwd)} · PEG ${t.m.peg.toFixed(1)}`, 19 * u, 500)), hgt = 56 * u, gap = 12 * u;
      const opts = [
        { x: g.cx + g.R + gap, y: g.cy - 2 * u, anchor: "start", b: [g.cx + g.R + gap, g.cy - 26 * u, g.cx + g.R + gap + w, g.cy + 30 * u] },
        { x: g.cx - g.R - gap, y: g.cy - 2 * u, anchor: "end", b: [g.cx - g.R - gap - w, g.cy - 26 * u, g.cx - g.R - gap, g.cy + 30 * u] },
        { x: g.cx - w / 2, y: g.cy + g.R + 30 * u, anchor: "start", b: [g.cx - w / 2, g.cy + g.R + 4 * u, g.cx + w / 2, g.cy + g.R + 4 * u + hgt] },
        { x: g.cx - w / 2, y: g.cy - g.R - 38 * u, anchor: "start", b: [g.cx - w / 2, g.cy - g.R - 62 * u, g.cx + w / 2, g.cy - g.R - 62 * u + hgt] },
        { x: g.cx + g.R * 0.75 + gap, y: g.cy + g.R * 0.75 + 22 * u, anchor: "start", b: [g.cx + g.R * 0.75 + gap, g.cy + g.R * 0.75 - 4 * u, g.cx + g.R * 0.75 + gap + w, g.cy + g.R * 0.75 - 4 * u + hgt] },
        { x: g.cx - g.R * 0.75 - gap, y: g.cy + g.R * 0.75 + 22 * u, anchor: "end", b: [g.cx - g.R * 0.75 - gap - w, g.cy + g.R * 0.75 - 4 * u, g.cx - g.R * 0.75 - gap, g.cy + g.R * 0.75 - 4 * u + hgt] },
      ];
      const inside = (b) => b[0] >= box.x0 && b[2] <= box.x1 && b[1] >= box.y0 && b[3] <= box.y1;
      const m = 20 * u, clear = (b) => !geo.some((o) => hit(b, [o.cx - o.R - m, o.cy - o.R - m, o.cx + o.R + m, o.cy + o.R + m])) && !taken.some((x) => hit(b, x));
      const area = (b) => [...geo.map((o) => [o.cx - o.R - m, o.cy - o.R - m, o.cx + o.R + m, o.cy + o.R + m]), ...taken].reduce((s, q) => s + Math.max(0, Math.min(b[2], q[2]) - Math.max(b[0], q[0])) * Math.max(0, Math.min(b[3], q[3]) - Math.max(b[1], q[1])), 0);
      const pick = opts.find((o) => inside(o.b) && clear(o.b)) || opts.filter((o) => inside(o.b)).sort((a, b) => area(a.b) - area(b.b))[0] || opts[0];
      taken.push(pick.b); out.set(t.symbol, pick);
    }
    return out;
  }

  // Peers as a field: forward P/E up, expected growth right, PEG rays from the origin, bubble AREA ∝ market value.
  function field(b, p, pl, X) {
    const on = TK.filter((t) => t.m.peg != null), off = TK.filter((t) => t.m.peg == null);
    const nice = (v, s) => Math.ceil(v / s) * s;
    const xmax = nice(Math.max(10, ...on.map((t) => t.inputs.growth * 100)) * 1.2, 5);
    const yraw = Math.max(20, ...on.map((t) => t.m.pe_fwd)) * 1.15;
    const ystep = [5, 10, 20, 25, 50, 100].find((s) => yraw / s <= 5) || 200, ymax = nice(yraw, ystep);
    const ax = X.x + 70 * u, ay = X.y + X.h - (off.length ? 150 : 90) * u, top = X.y + 40 * u, right = X.x + X.w - 30 * u;
    const px = (g) => ax + (g / xmax) * (right - ax), py = (v) => ay - (v / ymax) * (ay - top);
    const a1 = smooth(0, 0.3, p);
    let o = "";
    for (let v = 0; v <= ymax + 1e-9; v += ystep) { o += L(ax, py(v), right, py(v), { stroke: C.rule, sw: 1.4 * u, op: a1 }) + T(ax - 12 * u, py(v) + 7 * u, String(Math.round(v)), { size: 19 * u, anchor: "end", fill: C.muted, op: a1 }); }
    for (let g = xmax / 4; g <= xmax + 1e-9; g += xmax / 4) o += T(px(g), ay + 28 * u, `${Math.round(g)}%`, { size: 19 * u, anchor: "middle", fill: C.muted, op: a1 });
    o += L(ax, top - 10 * u, ax, ay, { sw: 3 * u, op: a1 }) + L(ax, ay, right, ay, { sw: 3 * u, op: a1 });
    o += T(ax + 10 * u, top - 14 * u, "↑ forward P/E (price ÷ next year's EPS)", { size: 20 * u, weight: 700, op: a1 });
    o += T(right, ay + 70 * u, "expected EPS growth, % a year →", { size: 20 * u, weight: 700, anchor: "end", op: a1 });
    const rays = smooth(0.15, 0.55, p);
    for (const k of [1, 2, 3]) {
      const gEnd = Math.min(xmax, ymax / k), ex = px(gEnd * rays), ey = py(k * gEnd * rays);
      o += L(ax, ay, ex, ey, { dash: `${9 * u} ${7 * u}`, sw: 2 * u, stroke: C.muted });
      if (rays > 0.95) o += T(ex - 8 * u, ey + (gEnd < xmax ? 24 * u : -10 * u), `PEG ${k}`, { size: 19 * u, weight: 800, anchor: "end", fill: C.muted, knock: true });
    }
    const maxCap = Math.max(...on.map((t) => t.m.mcap || 0), 1), rmax = Math.min(right - ax, ay - top) * 0.12;
    const geo = on.map((t) => ({ t, cx: px(t.inputs.growth * 100), cy: py(t.m.pe_fwd), R: Math.max(12 * u, rmax * Math.sqrt((t.m.mcap || 0) / maxCap)) }));
    const sides = labelSides(geo, { x0: ax, y0: top, x1: X.x + X.w, y1: ay });
    geo.slice().sort((a, b) => b.R - a.R).forEach((g) => {
      const t = g.t, i = TK.indexOf(t), k = stag(smooth(0.4, 1, p), i, N, 0.4);
      const r = g.R * clamp(outBack(k), 0, 1.2), cx = g.cx, cy = g.cy;
      o += `<circle data-s="bubble:${t.symbol}" cx="${cx}" cy="${cy}" r="${Math.max(0, r)}" fill="${t.color}" fill-opacity=".88" stroke="${C.ink}" stroke-width="${2.5 * u}"/>`;
      o += `<circle cx="${cx}" cy="${cy}" r="${3.5 * u}" fill="${C.ink}" opacity="${k}"/>`;
      const sd = sides.get(t.symbol);
      o += TB(`label:${t.symbol}`, [[sd.x, sd.y, t.symbol, { size: 28 * u, weight: 800, anchor: sd.anchor, stretch: "85%", knock: true }], [sd.x, sd.y + 26 * u, `P/E ${mult(t.m.pe_fwd)} · PEG ${t.m.peg.toFixed(1)}`, { size: 19 * u, anchor: sd.anchor, knock: true }]], k.toFixed(3));
    });
    if (off.length) {
      const why = off.map((t) => `${t.symbol}: ${t.why.peg || "missing forward P/E or growth"}`).join(". ");
      o += TB("not placed", wrap(`Not placed. ${why}.`, Math.floor(X.w / (19 * u * 0.5))).map((line, j) => [X.x, X.y + X.h - 30 * u + j * 26 * u, line, { size: 19 * u, fill: C.loss, weight: 600 }]), smooth(0.7, 1, p).toFixed(3));
    }
    return o;
  }

  // EV as the price of the whole house, on ONE shared linear scale: years of EBITDA.
  // Each bar is shares + debt, all divided by that company's EBITDA; the dashed cut-out is cash; the bracket is EV/EBITDA.
  function ev(b, p, pl, X) {
    const labW = 150 * u, rightW = 200 * u, px0 = X.x + labW, pw = X.w - labW - rightW - 20 * u;
    const rowsTop = X.y + 70 * u, rowH = (X.h - 70 * u) / N, bh = Math.min(rowH * 0.3, 56 * u);
    const ok = (t) => t.m.ev != null && t.inputs.ebitda > 0;
    const span = Math.max(1, ...TK.filter(ok).map((t) => Math.max(t.m.mcap + t.inputs.debt, t.m.mcap) / t.inputs.ebitda));
    const k = pw / span;
    let o = legend(X.x, X.y + 23 * u, [
      { label: "shares (market value)", sw: (x, y, w, h) => R(x, y, w, h, { fill: C.accent, sw: 2 * u, name: "swatch" }) },
      { label: "+ debt", sw: (x, y, w, h) => R(x, y, w, h, { fill: "url(#hatch)", sw: 2 * u, name: "swatch" }) },
      { label: "− cash", sw: (x, y, w, h) => R(x, y, w, h, { fill: C.bg, sw: 2 * u, dash: `${5 * u} ${4 * u}`, name: "swatch" }) },
    ], 20 * u);
    o += T(X.x + X.w, X.y + 23 * u, "one scale: years of EBITDA", { size: 18 * u, anchor: "end", fill: C.muted });
    TK.forEach((t, i) => {
      const m = t.m, I = t.inputs, y0 = rowsTop + i * rowH, by = y0 + rowH * 0.12;
      o += T(X.x, by + bh * 0.72, t.symbol, { size: 36 * u, weight: 800, stretch: "85%" });
      const rx = X.x + X.w, al = smooth(0.8, 1, p);
      if (!ok(t)) {
        o += T(px0, by + bh * 0.7, m.ev == null ? "needs market value, debt and cash" : "EBITDA is zero or negative, so there's no payback in years", { size: 20 * u, fill: C.muted });
        o += T(rx, by + bh * 0.62, "n/m", { size: 40 * u, weight: 800, anchor: "end", fill: C.loss });
        return;
      }
      const e = I.ebitda, a = ease(smooth(0, 0.4, p)), d = ease(smooth(0.3, 0.6, p)), c = ease(smooth(0.55, 0.85, p));
      const mw = (m.mcap / e) * k, dw = (Math.max(0, I.debt) / e) * k, cw = (Math.max(0, I.cash) / e) * k;
      o += R(px0, by, mw * a, bh, { fill: t.color, sw: 2.2 * u, name: `ev:${t.symbol}` });
      if (dw > 0) o += R(px0 + mw, by, dw * d, bh, { fill: "url(#hatch)", sw: 2.2 * u, op: d > 0 ? 1 : 0 });
      if (cw > 0 && c > 0) o += R(px0 + mw + dw - cw, by - 5 * u, cw, bh + 10 * u, { fill: C.bg, dash: `${6 * u} ${4 * u}`, sw: 2 * u, op: c });
      const evx = px0 + m.ev_ebitda * k;
      o += `<path d="M${px0} ${by + bh + 10 * u} v${8 * u} H${evx} v${-8 * u}" fill="none" stroke="${C.ink}" stroke-width="${2 * u}" opacity="${al}"/>`;
      o += T(px0, by + bh + 46 * u, `${money(m.mcap)} + ${money(I.debt)} debt − ${money(I.cash)} cash = ${money(m.ev)}, ÷ ${money(e)} EBITDA a year`, { size: 19 * u, op: al });
      o += TB(`years:${t.symbol}`, [[rx, by + bh * 0.62, `${yrs(m.ev_ebitda)} yrs`, { size: 40 * u, weight: 800, anchor: "end", stretch: "85%" }], [rx, by + bh * 0.62 + 28 * u, `EV ÷ EBITDA = ${mult(m.ev_ebitda)}`, { size: 18 * u, anchor: "end", fill: C.muted }]], al.toFixed(3));
    });
    return o;
  }

  // Spec sheet: every metric in one table, tickers as columns.
  function card(b, p, pl, X) {
    const rows = [
      ["Market value", (m) => money(m.mcap)], ["P/E, trailing", (m) => mult(m.pe_ttm)], ["P/E, forward", (m) => mult(m.pe_fwd)],
      ["Earnings yield", (m) => pct(m.ey_ttm)], ["PEG", (m) => mult(m.peg)], ["Price / sales", (m) => mult(m.ps)], ["Price / book", (m) => mult(m.pb)],
      ["EV / EBITDA", (m) => mult(m.ev_ebitda)], ["FCF yield", (m) => pct(m.fcf_yield)], ["Dividend yield", (m) => pct(m.div_yield)],
      ["Gross margin", (m) => pct(m.gross_margin)], ["Net margin", (m) => pct(m.net_margin)], ["Revenue", (m, t) => money(t.inputs.revenue)],
    ];
    const labW = X.w * 0.32, cw = (X.w - labW) / N, rh = Math.min(X.h / (rows.length + 1), 66 * u), fs = Math.min(rh * 0.46, 28 * u);
    let o = "";
    TK.forEach((t, i) => {
      const cx = X.x + labW + cw * (i + 0.5);
      o += R(cx - 46 * u, X.y + rh * 0.12, 92 * u, rh * 0.76, { fill: t.color, sw: 2 * u }) + T(cx, X.y + rh * 0.66, t.symbol, { size: fs * 1.05, weight: 800, anchor: "middle", stretch: "85%" });
    });
    o += L(X.x, X.y + rh, X.x + X.w, X.y + rh, { sw: 3 * u });
    rows.forEach(([label, f], r) => {
      const y = X.y + rh * (r + 1), k = smooth(0, 1, stag(p, r, rows.length, 0.6));
      if (r % 2 === 0) o += R(X.x, y, X.w, rh, { fill: C.surface, stroke: false, op: k });
      o += T(X.x + 12 * u, y + rh * 0.64, label, { size: fs, weight: 600, op: k });
      TK.forEach((t, i) => {
        const v = f(t.m, t), nm = v === "n/m" || v === "n/a";
        o += T(X.x + labW + cw * (i + 0.5), y + rh * 0.64, v, { size: fs, weight: nm ? 500 : 700, anchor: "middle", fill: nm ? C.muted : v.startsWith("−") ? C.loss : C.ink, op: k });
      });
    });
    o += L(X.x, X.y + rh * (rows.length + 1), X.x + X.w, X.y + rh * (rows.length + 1), { sw: 2 * u });
    return o;
  }

  const VIEWS = { payback, building, yields, margins, field, ev, card };

  /* ---------- timing: per beat, fade in, build, hold, fade out (seamless loop) ---------- */
  const DEF = { payback: [4.4, 3.2], building: [2.8, 3.4], yields: [2.6, 3.4], margins: [3.2, 3.2], field: [2.8, 3.6], ev: [2.8, 3.4], card: [1.6, 4.4] };
  const FADE = 0.4, LEAD = 0.3;
  let TOTAL = 0;
  const segs = S.beats.map((b) => {
    const [bd, hd] = DEF[b.view] || [2.6, 3.2];
    const s = { b, t0: TOTAL, build: b.build ?? bd, hold: b.hold ?? hd, out: b.out ?? 0.5 };
    s.d = LEAD + s.build + s.hold + s.out;
    TOTAL += s.d;
    return s;
  });
  // When rendering, rotate the loop so frame 0 is figure 1 fully built: a real poster frame for GIF/MP4 previews.
  // Still seamless (it's a rotation). The explorer starts at the true beginning. Set "poster": false to disable.
  const builtAt = (s) => s.t0 + LEAD + s.build + Math.min(0.4, s.hold / 2);
  const OFF = window.__CAPTURE__ && S.poster !== false && segs.length ? builtAt(segs[0]) : 0;
  window.MOTION = { width: W, height: H, fps: S.fps || 24, seconds: +TOTAL.toFixed(3) };
  window.FIN = { seconds: TOTAL, beats: segs.map((s) => ({ view: s.b.view, fig: s.b.fig, title: s.b.title, t: (((builtAt(s) - OFF) % TOTAL) + TOTAL) % TOTAL / TOTAL })) };

  function stateAt(t) {
    const sec = ((((t % 1) + 1) % 1) * TOTAL + OFF) % TOTAL;
    const i = Math.max(0, segs.findIndex((g) => sec < g.t0 + g.d));
    const g = segs[i], loc = sec - g.t0;
    const alpha = Math.min(smooth(0, FADE, loc), 1 - smooth(g.d - g.out, g.d, loc));
    const pl = clamp((loc - LEAD) / g.build);
    return { g, i, alpha, pl, p: ease(pl) };
  }

  /* ---------- layout guard: nothing may overlap ----------
     Positions are fixed per scene. After each frame is drawn, every label (data-l) and named shape (data-s) is
     measured from the real rendered geometry. In document order (furniture, header, shapes, then labels), any label
     that would touch an already-placed element fades out before contact: fade = 1 − smooth(0, 0.12, overlap ratio),
     with label boxes padded 1.4% of the type unit's 1080 px against other labels (0.4% against shapes, so a value label can sit
     beside its own bar) and the ratio measured against the smaller box. window.__boxes lists the result
     for scripts/check-overlaps.mjs. */
  function opOf(el, root) { let o = 1; for (let e = el; e && e !== root; e = e.parentNode) { const v = e.getAttribute && e.getAttribute("opacity"); if (v != null) o *= +v; } return o; }
  function guard(svg) {
    const PAD = { label: 15 * u, shape: 4 * u }, placed = [], boxes = []; // 1.4% / 0.4% of a 1080 frame, scaled with the type
    // A block's box is the union of its text lines; background plates (knockouts) don't count as content.
    const one = (e) => { const b = e.getBBox(); return [b.x, b.y, b.x + b.width, b.y + b.height]; };
    const bb = (el) => {
      if (el.tagName.toLowerCase() !== "g") return one(el);
      const bs = [...el.querySelectorAll("text")].filter((t) => t.textContent.trim()).map(one);
      return bs.length ? [Math.min(...bs.map((q) => q[0])), Math.min(...bs.map((q) => q[1])), Math.max(...bs.map((q) => q[2])), Math.max(...bs.map((q) => q[3]))] : one(el);
    };
    const ratio = (b0) => {
      let w = 0;
      for (const { b: q, kind } of placed) {
        const pad = PAD[kind], b = [b0[0] - pad, b0[1] - pad, b0[2] + pad, b0[3] + pad];
        const ix = Math.min(b[2], q[2]) - Math.max(b[0], q[0]), iy = Math.min(b[3], q[3]) - Math.max(b[1], q[1]);
        if (ix > 0 && iy > 0) w = Math.max(w, (ix * iy) / Math.max(1, Math.min((b0[2] - b0[0]) * (b0[3] - b0[1]), (q[2] - q[0]) * (q[3] - q[1]))));
      }
      return w;
    };
    for (const el of svg.querySelectorAll("[data-s]")) {
      const b = bb(el), op = opOf(el, svg);
      if (b[2] - b[0] < 0.5 || b[3] - b[1] < 0.5) continue;
      if (op > 0.2) placed.push({ b, kind: "shape" });
      boxes.push({ name: el.getAttribute("data-s"), box: b.map(Math.round), op: +op.toFixed(2) });
    }
    for (const el of svg.querySelectorAll("[data-l]")) {
      if (!el.textContent.trim()) continue;
      const b = bb(el); let op = opOf(el, svg);
      if (op > 0.02) {
        const f = 1 - smooth(0, 0.12, ratio(b));
        if (f < 1) { el.setAttribute("opacity", ((+(el.getAttribute("opacity") ?? 1)) * f).toFixed(3)); op *= f; }
      }
      if (op > 0.2) placed.push({ b, kind: "label" });
      boxes.push({ name: el.getAttribute("data-l"), box: b.map(Math.round), op: +op.toFixed(2) });
    }
    window.__boxes = boxes;
  }

  /* ---------- frame ---------- */
  const BAND = band(), FOOTER = footer();
  let stage;
  window.renderFrame = function (t) {
    const s = stateAt(t), b = s.g.b;
    const hd = header(b, BAND.bottom);
    const X = { x: PAD, y: hd.bottom + 44 * u, w: W - 2 * PAD, h: footTop - 44 * u - (hd.bottom + 44 * u) };
    const body = (VIEWS[b.view] || card)(b, s.p, s.pl, X);
    stage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${DEFS}<rect width="${W}" height="${H}" fill="${C.bg}"/>${BAND.svg}${FOOTER}<g opacity="${s.alpha.toFixed(3)}">${hd.svg}${body}</g></svg>`;
    guard(stage.firstChild);
    stage.setAttribute("aria-label", `${b.title}. ${b.caption || ""}`);
    return s;
  };

  /* ---------- data + sources panel (explorer only) ---------- */
  function panel() {
    const th = TK.map((t) => `<th>${esc(t.symbol)}</th>`).join("");
    const row = (label, f, note) => `<tr><td>${esc(label)}${note ? ` <span class="note">${esc(note)}</span>` : ""}</td>${TK.map((t) => `<td>${esc(f(t))}</td>`).join("")}</tr>`;
    const I = (k, fmt = money) => (t) => (t.inputs[k] == null ? "—" : fmt(t.inputs[k]));
    const inputs = [
      ["Share price", I("price")], ["Shares outstanding", I("shares", (v) => `${sig(v / 1e9)}B`)], ["EPS, trailing 12 mo", I("eps_ttm")], ["EPS, forward 12 mo (estimate)", I("eps_fwd")],
      ["Revenue", I("revenue")], ["Gross profit", I("gross_profit")], ["Operating income", I("operating_income")], ["Net income", I("net_income")], ["EBITDA", I("ebitda")],
      ["Free cash flow", I("fcf")], ["Total debt", I("debt")], ["Cash", I("cash")], ["Book value (equity)", I("book_value")], ["Dividend per share, annual", I("dividend")], ["Expected EPS growth, % a year", I("growth", pct)],
    ];
    const M = (k, fmt) => (t) => (t.m[k] == null ? (t.why[k] ? "n/m" : "—") : fmt(t.m[k]));
    const derived = [
      ["Market value", M("mcap", money), "price × shares"], ["P/E, trailing", M("pe_ttm", mult), "price ÷ trailing EPS"], ["P/E, forward", M("pe_fwd", mult), "price ÷ forward EPS"],
      ["Earnings yield", M("ey_ttm", pct), "trailing EPS ÷ price"], ["PEG", M("peg", mult), "forward P/E ÷ growth %"], ["Price / sales", M("ps", mult), "market value ÷ revenue"],
      ["Price / book", M("pb", mult), "market value ÷ book value"], ["Enterprise value", M("ev", money), "market value + debt − cash"], ["EV / EBITDA", M("ev_ebitda", mult), ""],
      ["FCF yield", M("fcf_yield", pct), "free cash flow ÷ market value"], ["Dividend yield", M("div_yield", pct), "dividend ÷ price"],
      ["Gross margin", M("gross_margin", pct), ""], ["Operating margin", M("op_margin", pct), ""], ["Net margin", M("net_margin", pct), ""],
      ["Payback with growth", M("payback_growth", (v) => `${yrs(v)} yrs`), "years for growing EPS to sum to the price"],
    ];
    const whys = TK.flatMap((t) => Object.entries(t.why).map(([k, w]) => `${t.symbol} ${k.replace(/_/g, " ")}: ${w}`));
    const srcs = TK.map((t) => `<li><b>${esc(t.symbol)}</b>${t.name ? ` (${esc(t.name)})` : ""}: ${esc(t.source || "no source given")}${t.asOf ? `, as of ${esc(t.asOf)}` : ""}${t.derived.length ? `. Derived: ${esc(t.derived.join("; "))}` : ""}</li>`).join("");
    const bench = S.benchmark ? `<li><b>${esc(S.benchmark.label)}</b>: ${pct(S.benchmark.rate)}${S.benchmark.source ? `, ${esc(S.benchmark.source)}` : ""}${S.benchmark.asOf ? `, as of ${esc(S.benchmark.asOf)}` : ""}</li>` : "";
    return `${S.sample ? `<p><b>Sample data.</b> These numbers are illustrative, not current market data.</p>` : ""}
      <h2>Inputs</h2><div class="scroll"><table><thead><tr><th></th>${th}</tr></thead><tbody>${inputs.map(([l, f]) => row(l, f)).join("")}</tbody></table></div>
      <h2>Derived metrics</h2><div class="scroll"><table><thead><tr><th></th>${th}</tr></thead><tbody>${derived.map(([l, f, n]) => row(l, f, n)).join("")}</tbody></table></div>
      ${whys.length ? `<h2>Not meaningful</h2><ul>${whys.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      <h2>Sources</h2><ul>${srcs}${bench}${(S.notes || []).map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
      <p class="note" style="margin-top:16px">Trailing means the last twelve months reported. Forward means analysts' estimate for the next twelve months. Every figure is as of the date shown and will change. This explains the numbers. It is not investment advice.</p>`;
  }

  /* ---------- harness: capture or explorer ---------- */
  document.addEventListener("DOMContentLoaded", init);
  if (document.readyState !== "loading") init();
  function init() {
    if (stage) return;
    stage = document.getElementById("stage");
    stage.style.width = W + "px"; stage.style.height = H + "px";
    const wrapEl = document.getElementById("wrap");
    if (window.__CAPTURE__) { document.documentElement.classList.add("capture"); wrapEl.style.width = W + "px"; wrapEl.style.height = H + "px"; window.renderFrame(0); return; }
    const ui = document.getElementById("controls");
    document.getElementById("data").innerHTML = panel();
    const chips = document.getElementById("beats");
    chips.innerHTML = S.beats.map((b, i) => `<button data-beat="${i}">${b.fig}. ${esc(b.view === "ev" ? "EV" : b.view[0].toUpperCase() + b.view.slice(1))}</button>`).join("");
    const fit = () => {
      const k = Math.min(innerWidth / W, (innerHeight - ui.offsetHeight - 8) / H);
      stage.style.transform = `scale(${k})`;
      wrapEl.style.width = W * k + "px"; wrapEl.style.height = H * k + "px";
    };
    addEventListener("resize", fit); fit();
    let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, t = 0, last = performance.now(), cur = -1;
    const slider = ui.querySelector("input"), playBtn = ui.querySelector("[data-act=play]");
    const show = () => {
      const s = window.renderFrame(t);
      slider.value = Math.round(t * 999); playBtn.textContent = playing ? "Pause" : "Play";
      if (s.i !== cur) { cur = s.i; chips.querySelectorAll("button").forEach((el, j) => el.classList.toggle("on", j === cur)); }
    };
    // Playing: start the figure's build. Paused: show it fully built.
    const go = (i) => { const g = segs[(i + segs.length) % segs.length]; t = (g.t0 + (playing ? FADE : LEAD + g.build + 0.05)) / TOTAL; show(); };
    ui.addEventListener("click", (e) => {
      const a = e.target.dataset.act, bi = e.target.dataset.beat;
      if (a === "play") { playing = !playing; last = performance.now(); show(); }
      if (a === "next") go(cur + 1);
      if (a === "prev") go(cur - 1);
      if (bi != null) go(+bi);
    });
    slider.addEventListener("input", () => { playing = false; t = slider.value / 999; show(); });
    stage.addEventListener("click", () => go(cur + 1));
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(cur + 1);
      if (e.key === "ArrowLeft") go(cur - 1);
      if (e.code === "Space") { playing = !playing; last = performance.now(); e.preventDefault(); show(); }
    });
    (function tick(now) {
      if (playing) { t = (t + (now - last) / 1000 / TOTAL) % 1; show(); }
      last = now; requestAnimationFrame(tick);
    })(last);
    show();
  }
})();

</script>
</body>
</html>
