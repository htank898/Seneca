<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  #stage svg { display: block; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; cursor: pointer; }
  #controls { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    font: 600 14px/1 system-ui, sans-serif; background: rgba(0,0,0,.7); padding: 8px 10px; border-radius: 10px; }
  #controls button { font: inherit; color: #111; background: #f5c518; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  #controls input { width: min(40vw, 360px); accent-color: #f5c518; }
  .capture #controls { display: none; }
  .capture body, .capture html { background: transparent; }
  .capture #stage { cursor: default; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls" aria-label="Playback">
  <button data-act="prev" aria-label="Previous step">◀</button>
  <button data-act="play">Pause</button>
  <button data-act="next" aria-label="Next step">▶</button>
  <input type="range" min="0" max="1000" value="0" aria-label="Scrub">
</div>
<script>window.SCENE = __SCENE__;</script>
<script>
__ENGINE__
</script>
</body>
</html>
