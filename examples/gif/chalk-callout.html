<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  /* A talking-head "video" that pauses mid-sentence so a chalkboard can explain the place it just named. */
  :root { --wall: #e8e0d2; --shelf: #c9b99f; --ink: #1c2026; --shirt: #2f4c6e; --skin: #dcab83; --hair: #3a2a1f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); background: var(--wall); overflow: hidden; transform-origin: 0 0; }
  svg { display: block; font-family: "Archivo", sans-serif; }
  .cap { font-weight: 700; font-size: 40px; fill: #fff; }
  #hud { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ccc; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; }
  .capture #hud { display: none; }
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- the "video": a person talking in front of a shelf -->
  <g id="video">
    <rect x="0" y="0" width="1280" height="720" fill="var(--wall)"/>
    <rect x="760" y="150" width="420" height="16" rx="4" fill="var(--shelf)"/>
    <rect x="790" y="96" width="34" height="54" rx="4" fill="#b5654a"/><rect x="830" y="84" width="28" height="66" rx="4" fill="#5d7f72"/>
    <rect x="864" y="104" width="40" height="46" rx="4" fill="#d9a441"/>
    <path d="M 1080 150 C 1070 110, 1100 90, 1120 70 M 1100 150 C 1110 120, 1140 110, 1160 100 M 1090 150 C 1080 130, 1050 120, 1040 105" stroke="#5d7f72" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="1070" y="128" width="50" height="24" rx="6" fill="#b5654a"/>
    <!-- person -->
    <g id="person">
      <path d="M 240 720 C 240 560, 300 500, 420 488 L 580 488 C 700 500, 760 560, 760 720 Z" fill="var(--shirt)"/>
      <rect x="455" y="420" width="90" height="90" rx="30" fill="#c9966f"/>
      <g id="head">
        <ellipse cx="500" cy="330" rx="118" ry="134" fill="var(--skin)"/>
        <path d="M 382 318 C 370 200, 450 168, 512 170 C 590 172, 640 220, 622 320 C 610 270, 580 238, 520 236 C 470 236, 420 250, 382 318 Z" fill="var(--hair)"/>
        <g id="eyes" fill="var(--ink)"><ellipse cx="456" cy="338" rx="9" ry="11"/><ellipse cx="548" cy="338" rx="9" ry="11"/></g>
        <path d="M 446 312 Q 458 304 470 310 M 534 310 Q 546 304 558 312" stroke="var(--hair)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse id="mouth" cx="502" cy="408" rx="26" ry="6" fill="#7a3b30"/>
      </g>
    </g>
    <!-- captions, timed like a transcript -->
    <rect id="capbox" x="0" y="606" width="0" height="64" rx="12" fill="rgba(20,22,26,.82)"/>
    <text id="cap" class="cap" x="640" y="651" text-anchor="middle"></text>
  </g>
  <rect id="dim" x="0" y="0" width="1280" height="720" fill="#0d1014" opacity="0"/>
  <g id="pause" opacity="0">
    <rect x="36" y="32" width="142" height="48" rx="24" fill="rgba(255,255,255,.92)"/>
    <rect x="58" y="44" width="8" height="24" rx="2" fill="var(--ink)"/><rect x="72" y="44" width="8" height="24" rx="2" fill="var(--ink)"/>
    <text x="92" y="64" font-size="20" font-weight="800" fill="var(--ink)">paused</text>
  </g>
  <g id="chalk"></g>
</svg>
</div>
<div id="hud">space pause · ←/→ scrub · <span id="tc">0.000</span></div>

<script src="../../skills/ai-gif/templates/chalk.js"></script>
<script>
/* ---------- the transcript: [word, start second] in scene time ---------- */
const WORDS = [
  ["Hi,", 0.4], ["I'm", 0.75], ["Harrison", 1.0], ["Tankersley.", 1.55],
  ["I'm", 2.6], ["from", 2.85], ["St.", 3.1], ["Louis,", 3.35], ["Missouri.", 3.75],
  ["I", 4.75], ["build", 4.95], ["things", 5.3], ["with", 5.65], ["AI.", 5.9],
];
const LINES = [[0, 4, 0.3, 2.45], [4, 9, 2.5, 4.6], [9, 14, 4.65, 7.2]]; // [first, end, show, hide]
const SCENE_SECONDS = 7.6;

/* The scene pauses right after "Missouri." and the chalkboard takes over for 5.2 s. */
const TL = Chalk.timeline(SCENE_SECONDS, [{ at: 4.3, dur: 5.2, name: "stl" }]);
window.MOTION = { width: 1280, height: 720, fps: 24, seconds: +TL.seconds.toFixed(3) };

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inOutCubic: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  outBack: (x) => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const $ = (s) => document.querySelector(s);

/* ---------- the chalkboard ---------- */
const layer = $("#chalk");
const board = Chalk.board($("#scene"), { parent: layer });
board.panel(700, 70, 520, 500);
const city = board.write("St. Louis,\nMissouri", { x: 960, y: 172, size: 150, maxWidth: 430, anchor: "middle", lineHeight: 0.8 });
// The Gateway Arch: two legs of a weighted catenary, plus the riverbank.
const archPath = (w, h, base) => {
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const u = -1 + (2 * i) / 40, a = 2.2;
    const y = base - h * (Math.cosh(a) - Math.cosh(a * u)) / (Math.cosh(a) - 1);
    pts.push(`${(960 + u * w).toFixed(1)} ${y.toFixed(1)}`);
  }
  return "M " + pts.join(" L ");
};
const arch = board.doodle([archPath(112, 190, 530), archPath(82, 160, 530), "M 800 534 Q 960 526 1120 536"], { rough: 1.5, width: 6 });
const sparkle = board.doodle(Chalk.shape.star(1112, 372, 16), { rough: 0.6, width: 4 });

/* ---------- the animation: a pure function of t ---------- */
window.renderFrame = function (t) {
  const sec = t * MOTION.seconds;
  const { scene, hold, p } = TL.at(sec);
  const hs = hold ? p * 5.2 : -1; // seconds into the hold

  // Talking: the mouth opens while a word is being said and freezes when the video is paused.
  const w = WORDS.findIndex(([, s], i) => scene >= s && scene < (WORDS[i + 1]?.[1] ?? s + 0.45));
  const speaking = w >= 0 && scene - WORDS[w][1] < 0.45;
  const open = speaking ? 0.5 + 0.5 * Math.abs(Math.sin((scene - WORDS[w][1]) * TAU * 3.2)) : 0;
  $("#mouth").setAttribute("ry", lerp(5, 20, open));
  const blink = [1.9, 5.0, 7.0].some((b) => Math.abs(scene - b) < 0.06);
  $("#eyes").setAttribute("transform", blink ? "translate(0 338) scale(1 .15) translate(0 -338)" : "");
  $("#head").setAttribute("transform", `rotate(${(Math.sin(scene * 1.7) * 2).toFixed(2)} 500 470)`);

  // Captions
  let txt = "";
  for (const [a, b, show, hide] of LINES) {
    if (scene >= show && scene < hide) txt = WORDS.slice(a, b).filter(([, s]) => scene >= s - 0.05).map(([x]) => x).join(" ");
  }
  $("#cap").textContent = txt;
  const cw = txt ? $("#cap").getComputedTextLength() + 56 : 0;
  $("#capbox").setAttribute("x", 640 - cw / 2); $("#capbox").setAttribute("width", cw);

  // Pause beat: dim the frozen frame, slide the board in, write, draw, slide out.
  const into = hold ? ease.outCubic(seg(hs, 0, 0.5)) : 0;
  const out = hold ? ease.inCubic(seg(hs, 4.65, 5.2)) : 0;
  $("#dim").setAttribute("opacity", 0.38 * (into - out));
  $("#pause").setAttribute("opacity", into - out);
  $("#pause").setAttribute("transform", `translate(0 ${(1 - ease.outBack(seg(hs, 0, 0.35))) * -20})`);
  const slide = hold ? (1 - ease.outCubic(seg(hs, 0.15, 0.85))) * 640 + out * 680 : 1400;
  layer.setAttribute("transform", `translate(${slide.toFixed(1)} 0)`);
  city.draw(hold ? seg(hs, 0.95, 2.55) : 0);
  arch.draw(hold ? ease.inOutCubic(seg(hs, 2.65, 4.05)) : 0);
  sparkle.draw(hold ? seg(hs, 4.1, 4.4) : 0);

  $("#tc").textContent = `${t.toFixed(3)}  ${sec.toFixed(2)}s`;
};

/* ---------- harness: sizing + preview loop (same as templates/motion-shell.html) ---------- */
(function () {
  const { width, height, fps, seconds } = window.MOTION;
  const stage = $("#stage");
  document.documentElement.style.setProperty("--w", width + "px");
  document.documentElement.style.setProperty("--h", height + "px");
  if (window.__CAPTURE__) { document.documentElement.classList.add("capture"); window.renderFrame(0); return; }
  const fit = () => {
    const k = Math.min(innerWidth / width, innerHeight / height);
    stage.style.transform = `translate(${(innerWidth - width * k) / 2}px, ${(innerHeight - height * k) / 2}px) scale(${k})`;
  };
  addEventListener("resize", fit); fit();
  let playing = true, t = 0, last = performance.now();
  const step = 1 / (fps * seconds);
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.key === "ArrowRight") { t = (t + step) % 1; window.renderFrame(t); }
    if (e.key === "ArrowLeft") { t = (t - step + 1) % 1; window.renderFrame(t); }
  });
  (function tick(now) {
    if (playing) { t = (t + (now - last) / 1000 / seconds) % 1; window.renderFrame(t); }
    last = now; requestAnimationFrame(tick);
  })(last);
})();
</script>
</body>
</html>
