<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<!-- Built by ai-finance-viz: finance.mjs inlines the scene and engine below. Edit the scene JSON and run `finance.mjs build`, not this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block" rel="stylesheet">
<style>
  :root { --bg: #e6eae8; --ink: #16191d; --muted: #5e7a94; --accent: #f5c518; --surface: #f3f5f4; --rule: #c3cbc7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: Archivo, system-ui, sans-serif; }
  #wrap { position: relative; overflow: hidden; margin: 0 auto; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); overflow: hidden; cursor: pointer; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; border-bottom: 2px solid var(--ink); background: var(--surface); position: sticky; top: 0; z-index: 2; }
  #controls button { font: 600 14px/1 Archivo, system-ui, sans-serif; letter-spacing: .02em; padding: 8px 12px; border: 2px solid var(--ink); background: var(--bg); color: var(--ink); cursor: pointer; }
  #controls button.on { background: var(--accent); }
  #controls button:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
  #controls input[type=range] { width: min(360px, 60vw); accent-color: var(--ink); }
  #beats { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #data { max-width: 1100px; margin: 24px auto 64px; padding: 0 16px; }
  #data h2 { font: 800 22px/1.2 Archivo, sans-serif; font-stretch: 75%; letter-spacing: .04em; text-transform: uppercase; margin: 28px 0 10px; }
  #data p, #data li { font: 400 15px/1.5 Archivo, sans-serif; color: var(--ink); max-width: 75ch; }
  #data ul { padding-left: 20px; }
  #data .scroll { overflow-x: auto; border: 2px solid var(--ink); background: var(--surface); }
  #data table { border-collapse: collapse; width: 100%; font: 400 14px/1.3 Archivo, sans-serif; font-variant-numeric: tabular-nums; }
  #data th, #data td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
  #data th:first-child, #data td:first-child { text-align: left; }
  #data thead th { border-bottom: 2px solid var(--ink); font-weight: 700; }
  #data .note { color: var(--muted); }
  .capture #controls, .capture #data { display: none; }
  .capture #wrap { margin: 0; }
  .capture #stage { cursor: default; }
  #fontwarm { position: absolute; opacity: 0; pointer-events: none; font-family: Archivo; font-weight: 800; font-stretch: 75%; }
</style>
</head>
<body>
<span id="fontwarm" aria-hidden="true">Aa0 <b style="font-weight:400;font-stretch:100%">Aa0</b></span>
<nav id="controls" aria-label="Playback">
  <button data-act="prev" aria-label="Previous figure">◀</button>
  <button data-act="play">Pause</button>
  <button data-act="next" aria-label="Next figure">▶</button>
  <input type="range" min="0" max="999" value="0" aria-label="Scrub">
  <div id="beats"></div>
</nav>
<div id="wrap"><div id="stage" role="img"></div></div>
<section id="data"></section>
<script>
/*SCENE*/
</script>
<script>
/*ENGINE*/
</script>
</body>
</html>
