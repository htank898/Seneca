<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<!-- <link href="https://fonts.googleapis.com/css2?family=...&display=swap" rel="stylesheet"> -->
<style>
  /* ------------------------------------------------------------------
     PAPER: change these three together. Letter = 8.5in x 11in, A4 = 210mm x 297mm.
     ------------------------------------------------------------------ */
  @page { size: 8.5in 11in; margin: 0; }
  :root {
    --paper-w: 8.5in;
    --paper-h: 11in;
    --margin: 0.85in;          /* live area inset from the trim edge */

    /* Neutral placeholders: replace with the occasion's own palette. */
    --paper: #ffffff;
    --ink: #1f2328;
    --muted: #5b6470;
    --accent: #2f5bea;
    --rule: #d8dde3;

    --font-display: Georgia, "Times New Roman", serif;
    --font-body: Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #d9d6d0; font-family: var(--font-body); color: var(--ink); }

  /* Each .page is one physical sheet, designed edge to edge (full-bleed stationery). */
  .page {
    position: relative;
    width: var(--paper-w); height: var(--paper-h);
    margin: 0.4in auto; overflow: hidden;
    background: var(--paper);
    box-shadow: 0 2px 18px rgba(0,0,0,.18);
    break-after: page;
  }
  .page:last-child { break-after: auto; }
  @media print {
    body { background: none; }
    .page { margin: 0; box-shadow: none; }
  }

  /* Stationery layer: decorative art that sits behind the content on every page. */
  .stationery { position: absolute; inset: 0; pointer-events: none; }
  .stationery .frame {
    position: absolute; inset: 0.35in;
    border: 1.5pt solid var(--accent); border-radius: 2pt;
  }
  .stationery .frame::after {
    content: ""; position: absolute; inset: 5pt;
    border: 0.5pt solid var(--accent); opacity: .6;
  }

  /* Live area: where the writing goes. */
  .content {
    position: absolute; inset: var(--margin);
    display: flex; flex-direction: column;
  }
  .letterhead { text-align: center; padding-bottom: 0.25in; border-bottom: 0.75pt solid var(--rule); margin-bottom: 0.35in; }
  .letterhead h1 { font-family: var(--font-display); font-weight: 400; font-size: 26pt; letter-spacing: .02em; }
  .letterhead p { font-size: 10pt; color: var(--muted); margin-top: 4pt; }

  .body { font-size: 11.5pt; line-height: 1.6; }
  .body p + p { margin-top: 0.8em; }
  .signoff { margin-top: auto; font-style: italic; }
  .footer { position: absolute; left: 0; right: 0; bottom: 0.5in; text-align: center; font-size: 8pt; color: var(--muted); }
</style>
</head>
<body>

<section class="page">
  <div class="stationery"><div class="frame"></div></div>
  <div class="content">
    <header class="letterhead">
      <h1>Title or Monogram</h1>
      <p>Subtitle, date, place</p>
    </header>
    <div class="body">
      <p>Replace this with the document's content. Keep everything inside <code>.content</code> so it stays within the live area.</p>
      <p>For multi-page documents, repeat <code>&lt;section class="page"&gt;</code> and split the content yourself so every sheet is designed on purpose.</p>
    </div>
    <p class="signoff">— Sign-off</p>
  </div>
  <div class="footer">1</div>
</section>

</body>
</html>
