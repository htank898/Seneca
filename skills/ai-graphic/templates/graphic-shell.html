<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphic</title>
<!-- Fonts: load from Google Fonts if you want them; render-png waits for document.fonts.ready -->
<style>
  :root {
    --bg: #eef1f4;
    --ink: #1f2328;
    --accent: #2f5bea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1b1d21; }
  body { padding: 32px; display: grid; gap: 40px; justify-items: center; font-family: system-ui, sans-serif; }

  /* An artboard is exactly its pixel size. Everything inside is positioned in that coordinate space. */
  .artboard {
    position: relative; overflow: hidden;
    background: var(--bg); color: var(--ink);
  }
  .artboard[data-transparent] { background: transparent; }

  /* ---------- harness styles (preview frame, labels, guides). Do not edit. ---------- */
  .frame { position: relative; }
  .frame > .artboard { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .frame-label { position: absolute; left: 0; top: -22px; font: 12px/1 ui-monospace, monospace; color: #aab; white-space: nowrap; }
  .checker { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 24px 24px; }
  .guides { position: absolute; inset: 0; pointer-events: none; z-index: 9999; display: none; }
  .show-guides .guides { display: block; }
  .guides .keep { position: absolute; outline: 3px dashed #00c853; outline-offset: -3px; }
  .guides .cover { position: absolute; background: rgba(255, 23, 68, .35); outline: 3px solid #ff1744; outline-offset: -3px; }
  .guides .circle { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 9999px rgba(255, 23, 68, .35); outline: 3px solid #ff1744; outline-offset: -3px; }
  .guides span { position: absolute; font: 600 18px/1 ui-monospace, monospace; color: #fff; background: #000a; padding: 4px 6px; }
  #hud { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ccc; background: #000a; padding: 6px 10px; border-radius: 6px; }
  .capture, .capture body { padding: 0; display: block; background: transparent; }
  .capture #hud, .capture .frame-label { display: none; }
  .capture .artboard { position: absolute; left: 0; top: 0; margin: 0; }
</style>
</head>
<body>

<!--
  One <section class="artboard"> per output image. Size it with a preset OR explicit pixels:
    data-preset="linkedin-banner"          (see PRESETS below / reference/graphic-parameters.md)
    data-w="1600" data-h="900"              (any size; overrides the preset)
  data-name sets the output filename (defaults to the preset name).
  data-transparent exports with an alpha channel (PNG only).
-->
<section class="artboard" data-preset="linkedin-banner" data-name="banner">
  <svg viewBox="0 0 1584 396" width="100%" height="100%" style="position:absolute;inset:0">
    <circle cx="1300" cy="198" r="140" fill="var(--accent)"/>
  </svg>
  <h1 style="position:absolute; left:620px; top:150px; font-size:64px;">Your headline here</h1>
</section>

<div id="hud">g toggle guides</div>

<script>
/* ---------- presets: size + platform guides (do not edit; add custom sizes with data-w/data-h) ----------
   keep:   [x, y, w, h] keep text/logos inside this box (crops on some screens fall outside it)
   covers: [[x, y, w, h, label], ...] areas the platform UI paints over
   circle: true when the platform crops the image to a circle */
const PRESETS = {
  "linkedin-banner":   { w: 1584, h: 396,  keep: [117, 88, 1350, 220], covers: [[0, 196, 560, 200, "profile photo (desktop)"]] },
  "linkedin-company":  { w: 1128, h: 191,  keep: [120, 20, 888, 151], covers: [[0, 111, 240, 80, "logo"]] },
  "linkedin-post":     { w: 1200, h: 627 },
  "linkedin-square":   { w: 1200, h: 1200 },
  "x-header":          { w: 1500, h: 500,  keep: [0, 60, 1500, 380], covers: [[0, 330, 400, 170, "profile photo"]] },
  "x-post":            { w: 1600, h: 900 },
  "youtube-banner":    { w: 2560, h: 1440, keep: [507, 508, 1546, 423] },
  "youtube-thumbnail": { w: 1280, h: 720,  covers: [[1120, 660, 150, 50, "duration"]] },
  "facebook-cover":    { w: 1640, h: 624,  keep: [0, 90, 1640, 444] },
  "og-image":          { w: 1200, h: 630,  keep: [60, 30, 1080, 570] },
  "github-social":     { w: 1280, h: 640,  keep: [40, 40, 1200, 560] },
  "instagram-square":  { w: 1080, h: 1080 },
  "instagram-portrait":{ w: 1080, h: 1350, keep: [0, 135, 1080, 1080] },
  "story":             { w: 1080, h: 1920, keep: [0, 250, 1080, 1340], covers: [[0, 0, 1080, 250, "top UI"], [0, 1590, 1080, 330, "reply bar"]] },
  "avatar":            { w: 800,  h: 800,  circle: true },
  "email-header":      { w: 1200, h: 400 },
  "slide-16x9":        { w: 1920, h: 1080 },
  "zoom-background":   { w: 1920, h: 1080, covers: [[560, 200, 800, 880, "you"]] },
  "desktop-wallpaper": { w: 2560, h: 1440 },
  "phone-wallpaper":   { w: 1170, h: 2532, covers: [[0, 0, 1170, 900, "clock"], [0, 2200, 1170, 332, "dock"]] },
  "app-icon":          { w: 1024, h: 1024, keep: [100, 100, 824, 824] },
  "emoji":             { w: 128,  h: 128 },
};

/* ---------- harness: sizing, guides, preview (do not edit) ---------- */
(function () {
  const capture = !!window.__CAPTURE__;
  if (capture) document.documentElement.classList.add("capture");
  const boards = [...document.querySelectorAll(".artboard")];
  window.ARTBOARDS = boards.map((a, i) => {
    const p = PRESETS[a.dataset.preset] || {};
    const w = +a.dataset.w || p.w, h = +a.dataset.h || p.h;
    if (!w || !h) throw new Error(`artboard ${i}: unknown preset "${a.dataset.preset}" and no data-w/data-h`);
    const name = a.dataset.name || a.dataset.preset || `graphic-${i + 1}`;
    a.style.width = w + "px"; a.style.height = h + "px";
    a.dataset.name = name;

    const g = document.createElement("div"); g.className = "guides";
    const box = (cls, [x, y, bw, bh, label]) => {
      const d = document.createElement("div"); d.className = cls;
      Object.assign(d.style, { left: x + "px", top: y + "px", width: bw + "px", height: bh + "px" });
      if (label) { const s = document.createElement("span"); s.textContent = label; s.style.left = "6px"; s.style.top = "6px"; d.append(s); }
      g.append(d);
    };
    if (p.keep) box("keep", [...p.keep, "keep content inside"]);
    (p.covers || []).forEach((c) => box("cover", c));
    if (p.circle) { const c = document.createElement("div"); c.className = "circle"; g.append(c); }
    a.append(g);

    if (!capture) {
      const frame = document.createElement("div"); frame.className = "frame";
      if (a.hasAttribute("data-transparent")) frame.classList.add("checker");
      const label = document.createElement("div"); label.className = "frame-label";
      label.textContent = `${name} · ${w}×${h}`;
      a.replaceWith(frame); frame.append(label, a);
      const fit = () => {
        const k = Math.min(1, (innerWidth - 64) / w, (innerHeight - 100) / h);
        a.style.transform = `scale(${k})`;
        frame.style.width = w * k + "px"; frame.style.height = h * k + "px";
      };
      addEventListener("resize", fit); fit();
    }
    return { name, w, h, transparent: a.hasAttribute("data-transparent") };
  });
  if (!capture) addEventListener("keydown", (e) => {
    if (e.key === "g") document.documentElement.classList.toggle("show-guides");
  });
  // Capture helper: show exactly one artboard at the origin.
  window.__solo = (name, guides) => {
    document.documentElement.classList.toggle("show-guides", !!guides);
    boards.forEach((a) => { a.style.display = a.dataset.name === name ? "" : "none"; });
  };
})();
</script>
</body>
</html>
