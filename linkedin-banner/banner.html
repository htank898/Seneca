<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  /* Colorways. :root is legal-pad; render all with --theme legal-pad,river,amber-terminal. */
  :root, [data-theme="legal-pad"] {   /* yellow legal pad, blue ballpoint */
    --field: #fbe7a1;
    --ink: #1e2024;
    --muted: #5a5444;
    --bar: #2340c8;
    --bar-ink: #fff8de;
    --pop: #2340c8;
    --soft: #9db0f5;
    --paper: #fff8de;
    --shade: #d6bf73;
  }
  [data-theme="river"] {              /* Mississippi mist, deep teal, marigold */
    --field: #d7e5e0;
    --ink: #1b2a2a;
    --muted: #4b5e5b;
    --bar: #0e6b63;
    --bar-ink: #f6c453;
    --pop: #d98a00;
    --soft: #f6c453;
    --paper: #f3f7f5;
    --shade: #a9c1ba;
  }
  [data-theme="amber-terminal"] {     /* navy CRT, amber phosphor */
    --field: #1f2338;
    --ink: #f1ede2;
    --muted: #a9abbd;
    --bar: #ffb000;
    --bar-ink: #1f2338;
    --pop: #ffb000;
    --soft: #c48a12;
    --paper: #2e3352;
    --shade: #141729;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; overflow: hidden; }
  html.capture, html.capture body { background: transparent; }
  #banner {
    position: absolute; left: 0; top: 0;
    width: var(--w); height: var(--h);
    background: var(--field); color: var(--ink);
    overflow: hidden; transform-origin: 0 0;
    font-family: "Inter Tight", sans-serif;
  }

  /* ---------- scene ---------- */
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 700; }
  svg.px { shape-rendering: crispEdges; display: block; }

  #bar { position: absolute; left: 0; top: 0; width: 100%; height: 30px; background: var(--bar); }
  #bar svg { position: absolute; top: 9px; }
  #tag {
    position: absolute; left: 0; top: 30px; height: 31px; padding: 0 12px;
    background: var(--ink); color: var(--field);
    font-size: 16px; line-height: 31px; letter-spacing: .01em;
  }

  .icon { position: absolute; width: 200px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .icon .art { height: 108px; display: flex; align-items: flex-end; }
  .label {
    font-size: 17px; line-height: 1; padding: 6px 9px 7px;
    background: var(--paper); color: var(--ink);
  }
  .icon.selected .label { background: var(--ink); color: var(--field); }
  .cursor { position: absolute; }

  #copy { position: absolute; left: 850px; top: 52px; }
  #chip {
    display: inline-flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 12px;
    background: var(--ink); color: var(--field);
    font-size: 18px; letter-spacing: .04em;
  }
  #chip i { display: block; width: 14px; height: 14px; background: var(--soft); }
  #name {
    margin-top: 16px;
    font-weight: 500; font-size: 84px; line-height: 76px; letter-spacing: -0.045em;
  }
  #role {
    margin-top: 16px; display: flex; align-items: baseline; gap: 12px;
    font-weight: 500; font-size: 29px; letter-spacing: -0.03em;
  }
  #role b { color: var(--pop); font-weight: 600; }
  #line {
    margin-top: 8px;
    font-weight: 400; font-size: 23px; letter-spacing: -0.02em; color: var(--muted);
  }
</style>
</head>
<body>
<div id="banner">
  <div id="bar"></div>
  <div id="tag" class="mono">Tankersley.sys</div>

  <div class="icon" style="left:440px; top:50px;"><div class="art"><svg class="px" data-sprite="friction"></svg></div><span class="label mono">Friction.log</span></div>
  <div class="icon selected" style="left:640px; top:50px;"><div class="art"><svg class="px" data-sprite="agent"></svg></div><span class="label mono">Agents/</span></div>
  <div class="icon" style="left:440px; top:212px;"><div class="art"><svg class="px" data-sprite="guard"></svg></div><span class="label mono">Guardrails.cfg</span></div>
  <div class="icon" style="left:640px; top:212px;"><div class="art"><svg class="px" data-sprite="flow"></svg></div><span class="label mono">Workflows.map</span></div>
  <svg class="px cursor" data-sprite="cursor" data-px="4" style="left:778px; top:118px;"></svg>

  <div id="copy">
    <div id="chip" class="mono"><span>&gt; FIND THE FRICTION</span><i></i><span>BUILD FOR AI</span><span>_</span></div>
    <h1 id="name">Harrison<br>Tankersley</h1>
    <div id="role"><span>AI Strategist</span><b>&gt;</b><span>accenture</span></div>
    <p id="line">Finding what slows teams down. Building AI that clears the way.</p>
  </div>
</div>

<script>
/* ---------- pixel sprites ---------- */
// K ink, W paper, P pop, L soft, B bar-ink; "." is transparent. Each icon gets a 1px shade offset.
const SPRITES = {
  friction: [
    "KKKKKKKKK.....",
    "KWWWWWWWKK....",
    "KWWWWWWWKWK...",
    "KWPPPPPWKKKK..",
    "KWWWWWWWWWWK..",
    "KWKKKKKKKKWK..",
    "KWWWWWWWWWWK..",
    "KWKKKKKKKKWK..",
    "KWWWWWWKKKKK..",
    "KWKKKKKLLLLK..",
    "KWWWWWKLWLLLK.",
    "KWWWWWKLLLLLK.",
    "KKKKKKKLLLLLK.",
    "........KKKKKK",
    "............KK",
  ],
  agent: [
    "......KK......",
    "......PP......",
    "KKKKKKKKKKKKKK",
    "KKKKKKKKKKWKWK",
    "KWWWWWWWWWWWWK",
    "KWWWWWWWWWWWWK",
    "KWWWPPWWWWPPWK",
    "KWWWPPWWWWPPWK",
    "KWWWWWWWWWWWWK",
    "KWWWWKKKKKWWWK",
    "KWWWWWWWWWWWWK",
    "KKKKKKKKKKKKKK",
  ],
  guard: [
    "KKKKKKKKKKKKKK",
    "KWWWWWWWWWWWWK",
    "KWWWWWWWWWWWWK",
    "KWWWWWWWWWPPWK",
    "KWWWWWWWWPPWWK",
    "KWWPPWWWPPWWWK",
    "KWWWPPWPPWWWWK",
    "KWWWWPPPWWWWWK",
    ".KWWWWPWWWWWK.",
    ".KWWWWWWWWWWK.",
    "..KWWWWWWWWK..",
    "...KWWWWWWK...",
    "....KWWWWK....",
    ".....KKKK.....",
  ],
  flow: [
    ".....KKKKK....",
    ".....KPPPK....",
    ".....KKKKK....",
    ".......K......",
    "..KKKKKKKKKK..",
    "..K....K...K..",
    "KKKKK.KKK.KKKK",
    "KWWWK.KWK.KWWK",
    "KKKKK.KKK.KKKK",
  ],
  cursor: [
    "K.........",
    "KK........",
    "KWK.......",
    "KWWK......",
    "KWWWK.....",
    "KWWWWK....",
    "KWWWWWK...",
    "KWWWWWWK..",
    "KWWWKKKK..",
    "KWKKWK....",
    "KK..KWK...",
    "K....KWK..",
    "......KK..",
  ],
  // the little ":: x" glyphs at either end of the title bar
  barL: ["L.L..B.B", "L.L...B.", "......B.", ".....B.B"],
  barR: ["B.B..L.L", ".B...L.L", ".B......", "B.B....."],
};
const COLORS = { K: "var(--ink)", W: "var(--paper)", P: "var(--pop)", L: "var(--soft)", B: "var(--bar-ink)", S: "var(--shade)" };

function drawSprite(svg, rows, px, shade) {
  const w = rows[0].length, h = rows.length, o = shade ? 1 : 0;
  svg.setAttribute("width", (w + o) * px);
  svg.setAttribute("height", (h + o) * px);
  let out = "";
  const cell = (x, y, c) => `<rect x="${x * px}" y="${y * px}" width="${px}" height="${px}" fill="${COLORS[c]}"/>`;
  if (shade) rows.forEach((r, y) => [...r].forEach((c, x) => { if (c !== ".") out += cell(x + 1, y + 1, "S"); }));
  rows.forEach((r, y) => [...r].forEach((c, x) => { if (c !== ".") out += cell(x, y, c); }));
  svg.innerHTML = out;
}
document.querySelectorAll("svg[data-sprite]").forEach((svg) => {
  drawSprite(svg, SPRITES[svg.dataset.sprite], +(svg.dataset.px || 7), svg.dataset.sprite !== "cursor");
});
for (const [id, left] of [["barL", 40], ["barR", 1520]]) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("px"); svg.style.left = left + "px";
  drawSprite(svg, SPRITES[id].map((r) => r.replace(/L/g, "B")), 3, false);
  document.getElementById("bar").appendChild(svg);
}

/* ---------- platform presets (from ai-banner/templates/banner-shell.html) ---------- */
const PRESETS = {
  "linkedin-profile": { width: 1584, height: 396, maxMB: 8, safe: [
    { kind: "keep-clear", x: 30, y: 170, w: 400, h: 226, label: "profile photo (approx.)" },
    { kind: "keep-inside", x: 120, y: 0, w: 1344, h: 396, label: "mobile crop (approx.)" } ] },
};

/* ---------- config ---------- */
window.BANNER = { ...PRESETS["linkedin-profile"] };

/* ---------- harness: sizing + preview (do not edit) ---------- */
(function () {
  const { width, height } = window.BANNER;
  const root = document.documentElement, banner = document.getElementById("banner");
  root.style.setProperty("--w", width + "px");
  root.style.setProperty("--h", height + "px");
  if (window.__CAPTURE__) { root.classList.add("capture"); return; }
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme) root.dataset.theme = theme;
  const fit = () => {
    const k = Math.min(innerWidth / width, innerHeight / height) * 0.96;
    banner.style.transform = `translate(${(innerWidth - width * k) / 2}px, ${(innerHeight - height * k) / 2}px) scale(${k})`;
  };
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
