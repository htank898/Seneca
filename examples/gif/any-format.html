<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Any Format</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  /* One card that keeps becoming something else. Same patent-drawing identity as the other examples. */
  :root { --paper: #e6eae8; --card: #f7f8f7; --ink: #16191d; --steel: #5e7a94; --signal: #f5c518; --mute: #c9d1cd; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #2a2e33; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; transform-origin: 0 0; }
  svg { display: block; font-family: "Archivo", sans-serif; }
  .head { font-weight: 850; font-stretch: 118%; font-size: 92px; fill: var(--ink); letter-spacing: -1.5px; }
  .kicker { font-weight: 650; font-size: 30px; fill: var(--steel); }
  .foot1 { font-weight: 800; font-stretch: 112%; font-size: 30px; fill: var(--ink); }
  .foot2 { font-weight: 500; font-size: 24px; fill: var(--steel); }
  .t { font-weight: 650; fill: var(--ink); }
  #hud { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ccc; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; }
  .capture #hud { display: none; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <clipPath id="headclip"><rect x="0" y="104" width="1080" height="116"/></clipPath>
  </defs>

  <text class="kicker" x="64" y="84">One HTML file.</text>
  <g clip-path="url(#headclip)">
    <text id="wordPrev" class="head" x="60" y="190"></text>
    <text id="wordCur" class="head" x="60" y="190"></text>
  </g>

  <!-- API sources live outside the card -->
  <g id="apiSrc">
    <g id="src0"><rect x="56" y="0" width="196" height="58" rx="29" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/><text class="t" x="154" y="38" font-size="24" text-anchor="middle">Database</text></g>
    <g id="src1"><rect x="56" y="0" width="196" height="58" rx="29" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/><text class="t" x="154" y="38" font-size="24" text-anchor="middle">Calendar</text></g>
    <g id="src2"><rect x="56" y="0" width="196" height="58" rx="29" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/><text class="t" x="154" y="38" font-size="24" text-anchor="middle">Weather API</text></g>
    <path id="wire0" d="" stroke="var(--ink)" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path id="wire1" d="" stroke="var(--ink)" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path id="wire2" d="" stroke="var(--ink)" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle id="pkt0" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/>
    <circle id="pkt1" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/>
    <circle id="pkt2" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/>
  </g>

  <!-- the card -->
  <rect id="shadow" fill="var(--ink)" rx="20"/>
  <rect id="card" fill="var(--card)" stroke="var(--ink)" stroke-width="4" rx="20"/>

  <!-- contents, each drawn in its own state's coordinates -->
  <g id="c-slide">
    <rect x="44" y="50" width="330" height="40" rx="5" fill="var(--ink)"/>
    <rect x="44" y="114" width="280" height="14" rx="7" fill="var(--steel)" opacity=".55"/>
    <rect x="44" y="140" width="220" height="14" rx="7" fill="var(--steel)" opacity=".55"/>
    <circle cx="54" cy="214" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/><rect x="76" y="207" width="250" height="14" rx="7" fill="var(--ink)" opacity=".8"/>
    <circle cx="54" cy="264" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/><rect x="76" y="257" width="210" height="14" rx="7" fill="var(--ink)" opacity=".8"/>
    <circle cx="54" cy="314" r="9" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/><rect x="76" y="307" width="230" height="14" rx="7" fill="var(--ink)" opacity=".8"/>
    <rect x="420" y="50" width="296" height="310" rx="12" fill="var(--signal)" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="568" cy="205" r="70" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>
    <text class="t" x="716" y="402" font-size="18" text-anchor="end" fill="var(--steel)">3 / 12</text>
  </g>

  <g id="c-page">
    <rect x="16" y="16" width="388" height="528" rx="6" fill="none" stroke="var(--steel)" stroke-width="2"/>
    <circle cx="210" cy="74" r="26" fill="var(--signal)" stroke="var(--ink)" stroke-width="4"/>
    <line x1="60" y1="124" x2="360" y2="124" stroke="var(--ink)" stroke-width="2"/>
    <g fill="var(--ink)" opacity=".7">
      <rect x="60" y="158" width="300" height="10" rx="5"/><rect x="60" y="180" width="280" height="10" rx="5"/><rect x="60" y="202" width="296" height="10" rx="5"/><rect x="60" y="224" width="180" height="10" rx="5"/>
      <rect x="60" y="262" width="292" height="10" rx="5"/><rect x="60" y="284" width="300" height="10" rx="5"/><rect x="60" y="306" width="250" height="10" rx="5"/>
      <rect x="60" y="344" width="290" height="10" rx="5"/><rect x="60" y="366" width="210" height="10" rx="5"/>
    </g>
    <path d="M 64 470 q 20 -40 40 -6 q 14 24 30 -10 q 12 -26 30 4 q 10 16 24 -2" stroke="var(--ink)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <g id="c-tile">
    <circle cx="260" cy="210" r="120" fill="var(--signal)" stroke="var(--ink)" stroke-width="5"/>
    <path d="M 205 215 l 38 38 l 74 -84" stroke="var(--ink)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260" y="438" text-anchor="middle" font-size="68" font-weight="850" style="font-stretch:118%" fill="var(--ink)">Shipped.</text>
  </g>

  <g id="c-chart">
    <line x1="50" y1="400" x2="720" y2="400" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <g id="bars"></g>
    <path id="trend" d="" stroke="var(--steel)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="c-data">
    <rect x="30" y="28" width="700" height="50" rx="8" fill="var(--ink)"/>
    <text x="60" y="62" font-size="24" font-weight="700" fill="var(--card)">Region</text>
    <text x="440" y="62" font-size="24" font-weight="700" fill="var(--card)" text-anchor="end">Deals</text>
    <text x="700" y="62" font-size="24" font-weight="700" fill="var(--card)" text-anchor="end">Revenue</text>
    <g id="rows"></g>
  </g>

  <g id="c-api">
    <g id="tiles"></g>
  </g>

  <g id="c-ui">
    <rect x="2" y="2" width="756" height="52" rx="18" fill="var(--ink)"/>
    <rect x="2" y="40" width="756" height="14" fill="var(--ink)"/>
    <circle cx="34" cy="28" r="8" fill="var(--signal)"/><circle cx="60" cy="28" r="8" fill="var(--mute)"/><circle cx="86" cy="28" r="8" fill="var(--mute)"/>
    <rect x="2" y="54" width="170" height="404" fill="var(--mute)" opacity=".6"/>
    <rect x="30" y="90" width="110" height="14" rx="7" fill="var(--ink)" opacity=".6"/><rect x="30" y="126" width="90" height="14" rx="7" fill="var(--ink)" opacity=".35"/><rect x="30" y="162" width="100" height="14" rx="7" fill="var(--ink)" opacity=".35"/>
    <g id="btn">
      <rect x="214" y="92" width="250" height="66" rx="33" fill="var(--signal)" stroke="var(--ink)" stroke-width="4"/>
      <text x="339" y="135" text-anchor="middle" font-size="27" font-weight="800" fill="var(--ink)">Run report</text>
    </g>
    <circle id="ripple" cx="339" cy="125" r="0" fill="none" stroke="var(--ink)" stroke-width="4"/>
    <g id="panel">
      <rect x="214" y="190" width="510" height="230" rx="14" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>
      <g id="minibars"></g>
    </g>
    <path id="cursor" d="M 0 0 L 0 44 L 12 33 L 21 52 L 30 48 L 21 30 L 36 30 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <g id="c-stack">
    <g id="chip0"><rect x="40" y="56" width="210" height="150" rx="18" fill="var(--signal)" stroke="var(--ink)" stroke-width="5"/><text x="145" y="149" text-anchor="middle" font-size="50" font-weight="900" style="font-stretch:104%" fill="var(--ink)">HTML</text></g>
    <g id="chip1"><rect x="275" y="56" width="210" height="150" rx="18" fill="var(--card)" stroke="var(--ink)" stroke-width="5"/><text x="380" y="149" text-anchor="middle" font-size="50" font-weight="900" style="font-stretch:104%" fill="var(--ink)">CSS</text></g>
    <g id="chip2"><rect x="510" y="56" width="210" height="150" rx="18" fill="var(--ink)" stroke="var(--ink)" stroke-width="5"/><text x="615" y="149" text-anchor="middle" font-size="50" font-weight="900" style="font-stretch:104%" fill="var(--card)">JS</text></g>
    <text id="stackline" x="380" y="282" text-anchor="middle" font-size="34" font-weight="650" fill="var(--steel)">That's the whole stack.</text>
  </g>

  <text class="foot1" x="64" y="1000">Build the disc, not the butler.</text>
  <text class="foot2" x="64" y="1040">github.com/htank898/Seneca</text>
</svg>
</div>
<div id="hud">space pause · ←/→ scrub · <span id="tc">0.000</span></div>

<script>
window.MOTION = { width: 1080, height: 1080, fps: 24, seconds: 12 };

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inOutCubic: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  outBack: (x) => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };

/* ---- the sequence: each state is a word, a card size/position, and a content group ---- */
const CY = 600;
const STATES = [
  { word: "Any format.", w: 760, h: 428, cx: 540, c: "c-slide", dur: 1.15 },
  { word: "Any format.", w: 420, h: 560, cx: 540, c: "c-page", dur: 1.15 },
  { word: "Any format.", w: 520, h: 520, cx: 540, c: "c-tile", dur: 1.15 },
  { word: "Any chart.", w: 760, h: 460, cx: 540, c: "c-chart", dur: 2.2 },
  { word: "Any data.", w: 760, h: 460, cx: 540, c: "c-data", dur: 2.2 },
  { word: "Any API.", w: 600, h: 430, cx: 670, c: "c-api", dur: 2.4 },
  { word: "Any interaction.", w: 760, h: 460, cx: 540, c: "c-ui", dur: 2.5 },
  { word: "No libraries.", w: 760, h: 340, cx: 540, c: "c-stack", dur: 2.3 },
];
const TOTAL = STATES.reduce((a, s) => a + s.dur, 0);
const MORPH = 0.26, FADE_IN = [0.2, 0.34], FADE_OUT = 0.1;

/* ---- build dynamic content ---- */
const BAR_V = [0.34, 0.48, 0.41, 0.66, 0.57, 0.82, 0.96];
const bars = BAR_V.map((v, i) => el("rect", { x: 78 + i * 92, width: 58, rx: 6, fill: i === 6 ? "var(--signal)" : "var(--ink)", stroke: "var(--ink)", "stroke-width": 4 }, $("bars")));
const trendPts = BAR_V.map((v, i) => [78 + i * 92 + 29, 400 - v * 300 - 26]);
$("trend").setAttribute("d", "M " + trendPts.map((p) => p.join(" ")).join(" L "));
const trendLen = trendPts.reduce((a, p, i) => i ? a + Math.hypot(p[0] - trendPts[i - 1][0], p[1] - trendPts[i - 1][1]) : 0, 0);
set($("trend"), { "stroke-dasharray": trendLen, "stroke-dashoffset": trendLen });

const ROWS = [["North", 42, 482100], ["South", 37, 391400], ["East", 51, 566800], ["West", 29, 318200], ["Central", 33, 344900]];
const rows = ROWS.map((r, i) => {
  const g = el("g", {}, $("rows"));
  el("rect", { x: 30, y: 92 + i * 70, width: 700, height: 58, rx: 8, fill: i === 2 ? "var(--signal)" : (i % 2 ? "var(--card)" : "#eceeed"), stroke: i === 2 ? "var(--ink)" : "none", "stroke-width": 3 }, g);
  el("text", { x: 60, y: 130 + i * 70, "font-size": 26, "font-weight": 650, fill: "var(--ink)" }, g).textContent = r[0];
  const d = el("text", { x: 440, y: 130 + i * 70, "font-size": 26, "font-weight": 650, fill: "var(--ink)", "text-anchor": "end" }, g);
  const v = el("text", { x: 700, y: 130 + i * 70, "font-size": 26, "font-weight": 800, fill: "var(--ink)", "text-anchor": "end" }, g);
  return { g, d, v, r };
});

const TILES = [["Orders today", 1284, (n) => Math.round(n).toLocaleString("en-US")], ["Meetings", 6, (n) => String(Math.round(n))], ["Austin", 72, (n) => Math.round(n) + "°F"]];
const tiles = TILES.map((tl, i) => {
  const y = 40 + i * 128;
  const g = el("g", {}, $("tiles"));
  el("rect", { x: 34, y, width: 532, height: 104, rx: 14, fill: i === 0 ? "var(--signal)" : "#eceeed", stroke: "var(--ink)", "stroke-width": 3 }, g);
  el("text", { x: 62, y: y + 62, "font-size": 28, "font-weight": 650, fill: "var(--ink)" }, g).textContent = tl[0];
  const v = el("text", { x: 538, y: y + 70, "font-size": 50, "font-weight": 850, fill: "var(--ink)", "text-anchor": "end", style: "font-stretch:115%" }, g);
  return { v, tl };
});

const MINI = [0.45, 0.7, 0.55, 0.9, 0.65];
const minibars = MINI.map((v, i) => el("rect", { x: 262 + i * 88, width: 52, rx: 5, fill: i === 3 ? "var(--signal)" : "var(--ink)", stroke: "var(--ink)", "stroke-width": 3 }, $("minibars")));

/* ---- frame ---- */
window.renderFrame = function (t) {
  // locate state
  let u = t * TOTAL, idx = 0;
  while (u >= STATES[idx].dur) { u -= STATES[idx].dur; idx++; if (idx >= STATES.length) { idx = STATES.length - 1; u = STATES[idx].dur - 1e-6; break; } }
  const S = STATES[idx], P = STATES[(idx + STATES.length - 1) % STATES.length];

  // card geometry
  const k = ease.inOutCubic(seg(u, 0, MORPH));
  const w = lerp(P.w, S.w, k), h = lerp(P.h, S.h, k), cx = lerp(P.cx, S.cx, k);
  const x = cx - w / 2, y = CY - h / 2;
  set($("card"), { x, y, width: w, height: h });
  set($("shadow"), { x: x + 12, y: y + 12, width: w, height: h });

  // contents
  const fin = ease.outCubic(seg(u, FADE_IN[0], FADE_IN[1])) * (1 - seg(u, S.dur - FADE_OUT, S.dur));
  for (const s of STATES) {
    const g = $(s.c);
    if (s === S) { g.setAttribute("opacity", fin.toFixed(3)); g.setAttribute("transform", `translate(${S.cx - S.w / 2} ${CY - S.h / 2 + (1 - fin) * 10})`); }
    else if (s.c !== S.c) g.setAttribute("opacity", 0);
  }

  // headline swap
  const changed = S.word !== P.word;
  const wk = changed ? ease.inOutCubic(seg(u, 0.02, 0.32)) : 1;
  $("wordCur").textContent = S.word;
  $("wordPrev").textContent = P.word;
  set($("wordCur"), { y: lerp(300, 190, wk) });
  set($("wordPrev"), { y: lerp(190, 70, wk), opacity: changed ? (1 - wk).toFixed(3) : 0 });

  // chart
  if (S.c === "c-chart") {
    bars.forEach((b, i) => { const g = ease.outCubic(seg(u, 0.28 + i * 0.07, 0.72 + i * 0.07)); const bh = BAR_V[i] * 300 * g; set(b, { y: 400 - bh, height: Math.max(0.01, bh) }); });
    $("trend").setAttribute("stroke-dashoffset", (trendLen * (1 - ease.inOutCubic(seg(u, 0.85, 1.4)))).toFixed(1));
  }
  // data
  if (S.c === "c-data") {
    rows.forEach((r, i) => {
      const a = ease.outCubic(seg(u, 0.26 + i * 0.08, 0.6 + i * 0.08));
      set(r.g, { opacity: a.toFixed(3), transform: `translate(${(1 - a) * 40} 0)` });
      const c = ease.outCubic(seg(u, 0.4 + i * 0.08, 1.2 + i * 0.08));
      r.d.textContent = Math.round(r.r[1] * c);
      r.v.textContent = "$" + Math.round(r.r[2] * c).toLocaleString("en-US");
    });
  }
  // api
  const apiOn = S.c === "c-api" ? fin : 0;
  $("apiSrc").setAttribute("opacity", apiOn.toFixed(3));
  if (S.c === "c-api") {
    const left = S.cx - S.w / 2;
    tiles.forEach((tile, i) => {
      const sy = CY - S.h / 2 + 40 + i * 128 + 52;            // tile middle
      const py = sy - 29;
      $("src" + i).setAttribute("transform", `translate(0 ${py})`);
      const d = `M 252 ${sy} C 300 ${sy} ${left - 50} ${sy} ${left} ${sy}`;
      $("wire" + i).setAttribute("d", d);
      const pk = ((u * 1.1 + i * 0.27) % 1);
      const px = lerp(252, left, pk);
      set($("pkt" + i), { cx: px, cy: sy, opacity: (seg(pk, 0, 0.1) * (1 - seg(pk, 0.9, 1))).toFixed(2) });
      const c = ease.outCubic(seg(u, 0.35 + i * 0.1, 1.2 + i * 0.1));
      const live = i === 0 ? Math.floor(seg(u, 1.3, S.dur) * 9) : 0;   // orders keep ticking
      tile.v.textContent = tile.tl[2](tile.tl[1] * c + live);
    });
  }
  // interaction
  if (S.c === "c-ui") {
    const m = ease.inOutCubic(seg(u, 0.28, 0.85));
    const cxp = lerp(640, 350, m), cyp = lerp(420, 128, m);
    const press = seg(u, 0.87, 0.95) * (1 - seg(u, 0.99, 1.1));
    $("cursor").setAttribute("transform", `translate(${cxp} ${cyp}) scale(${1 - press * 0.12})`);
    $("btn").setAttribute("transform", `translate(339 125) scale(${1 - press * 0.06}) translate(-339 -125)`);
    const rp = seg(u, 0.91, 1.35);
    set($("ripple"), { r: 40 + rp * 120, opacity: (rp > 0 ? 1 - rp : 0).toFixed(2) });
    const open = ease.outCubic(seg(u, 1.02, 1.45));
    $("panel").setAttribute("opacity", open.toFixed(3));
    $("panel").setAttribute("transform", `translate(0 ${(1 - open) * 18})`);
    minibars.forEach((b, i) => { const g = ease.outBack(seg(u, 1.15 + i * 0.07, 1.55 + i * 0.07)); const bh = Math.max(0.01, MINI[i] * 160 * g); set(b, { y: 395 - bh, height: bh }); });
  }
  // no libraries
  if (S.c === "c-stack") {
    [0, 1, 2].forEach((i) => {
      const p = ease.outBack(seg(u, 0.24 + i * 0.12, 0.6 + i * 0.12));
      $("chip" + i).setAttribute("transform", `translate(${145 + i * 235} 131) scale(${Math.max(0.001, p)}) translate(${-(145 + i * 235)} -131)`);
    });
    $("stackline").setAttribute("opacity", ease.outCubic(seg(u, 0.75, 1.05)).toFixed(3));
  }
  $("tc").textContent = t.toFixed(3);
};

(function () {
  const { width, height, fps, seconds } = window.MOTION;
  const stage = document.getElementById("stage");
  document.documentElement.style.setProperty("--w", width + "px");
  document.documentElement.style.setProperty("--h", height + "px");
  if (window.__CAPTURE__) { document.documentElement.classList.add("capture"); window.renderFrame(0); return; }
  const fit = () => {
    const k = Math.min(innerWidth / width, innerHeight / height);
    stage.style.transform = `translate(${(innerWidth - width * k) / 2}px, ${(innerHeight - height * k) / 2}px) scale(${k})`;
  };
  addEventListener("resize", fit); fit();
  let playing = true, t = 0, last = performance.now();
  const step = 1 / (fps * seconds);
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.key === "ArrowRight") { t = (t + step) % 1; window.renderFrame(t); }
    if (e.key === "ArrowLeft") { t = (t - step + 1) % 1; window.renderFrame(t); }
  });
  (function tick(now) {
    if (playing) { t = (t + (now - last) / 1000 / seconds) % 1; window.renderFrame(t); }
    last = now; requestAnimationFrame(tick);
  })(last);
})();
</script>
</body>
</html>
