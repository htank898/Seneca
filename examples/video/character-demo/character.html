<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="voice/timings.js" onerror="void 0"></script>
<script src="voice/visemes.js" onerror="void 0"></script>
<style>
  /* Patent-drawing identity from examples/gif/any-format.html, plus two character colors:
     mailbox poppy (scarf, stamps) and a warm skin tone. Shading is done with hatching, like a patent plate. */
  :root {
    --paper: #e6eae8; --card: #f7f8f7; --ink: #16191d; --steel: #5e7a94; --signal: #f5c518; --mute: #c9d1cd;
    --poppy: #e4473a; --skin: #f1c39c; --skin2: #dfa47c; --floor: #d6ddd9; --bag: #3f5466; --bag2: #33465a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #2a2e33; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); background: var(--paper); overflow: hidden; transform-origin: 0 0; }
  svg { display: block; font-family: "Archivo", sans-serif; }
  .lbl { font-weight: 650; font-size: 36px; fill: var(--steel); }
  .big { font-weight: 900; font-stretch: 118%; fill: var(--ink); }
  .t { font-weight: 750; fill: var(--ink); }
  #hud { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ccc; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; }
  .capture #hud { display: none; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>

    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#5e7a94" stroke-opacity=".13" stroke-width="2"/>

    <linearGradient id="jacketShade" x1="0" x2="1" y1="0" y2="0">

    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">

    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">

  <!-- the character -->

    <ellipse id="floorShadow" cx="0" cy="2" rx="150" ry="18" fill="var(--ink)" opacity=".16"/>
    <g id="charBody" filter="url(#soft)">
      <!-- legs -->

        <rect x="-54" y="-118" width="40" height="104" rx="16" fill="#2b3239" stroke="var(--ink)" stroke-width="5"/>

        <rect x="30" y="-118" width="24" height="104" rx="12" fill="url(#hatch)"/>
        <path d="M -70 -2 C -72 -26 -44 -32 -20 -24 C -8 -20 -6 -6 -10 -2 Z" fill="var(--ink)"/>

        <path d="M -60 -16 C -52 -24 -38 -24 -30 -20" stroke="#4b5560" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 60 -16 C 52 -24 38 -24 30 -20" stroke="#4b5560" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <g id="torso">
        <!-- jacket (breathes) -->

          <path id="jacket" fill="var(--signal)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>

            <path d="M 40 -548 C 100 -536 124 -500 122 -446 Q 90 -452 60 -455 Z" fill="url(#hatch)"/>
            <path d="M -130 -448 Q 0 -470 150 -444 Q 168 -436 150 -428 Q 0 -446 -130 -430 Q -142 -440 -130 -448 Z" fill="#4c6479" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="0" cy="-497" r="20" fill="var(--signal)" stroke="var(--ink)" stroke-width="4.5"/>
            <rect x="-11" y="-504" width="22" height="15" rx="2" fill="#fbfbf8" stroke="var(--ink)" stroke-width="3"/>
            <path d="M -11 -504 L 0 -496 L 11 -504" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
          </g>
        </g>
        <!-- scarf knot + tails (follow-through) -->
        <g id="scarfTails">
          <path id="tailA" fill="none" stroke="var(--ink)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="tailAf" fill="none" stroke="var(--poppy)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="tailB" fill="none" stroke="var(--ink)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="tailBf" fill="none" stroke="#c93b30" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="-300" r="19" fill="var(--poppy)" stroke="var(--ink)" stroke-width="5"/>

        <g id="armR"><path class="ink" fill="none" stroke="var(--ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="fill" fill="none" stroke="var(--signal)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="shade" fill="none" stroke="#16191d" stroke-opacity=".10" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <g class="hand"></g></g>
      </g>
    </g>
  </g>

  <rect width="1080" height="1080" filter="url(#grain)" pointer-events="none"/>
</svg>
</div>
<div id="hud">space play/pause · ←/→ frame · shift+←/→ scene · <span id="tc">0.00s</span> · <span id="sc"></span></div>
<audio id="narration" src="voice/narration.wav" preload="auto"></audio>

<script>
const CONFIG = { width: 1080, height: 1080, fps: 30 };
window.VIDEO = window.VIDEO || (window.VIDEO_TIMINGS ? { ...CONFIG, duration: window.VIDEO_TIMINGS.duration, scenes: window.VIDEO_TIMINGS.scenes } : null);
if (!window.VIDEO) throw new Error("Run tts.py first: voice/timings.js not found");
if (!window.VIDEO_VISEMES) throw new Error("Run visemes.py first: voice/visemes.js not found");
const V = window.VIDEO;
const VIS = {}; window.VIDEO_VISEMES.scenes.forEach((s) => { VIS[s.id] = s; });

/* ---------- helpers (from templates/video-shell.html) ---------- */
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const ease = {
  linear: (x) => x,
  inOutCubic: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  outBack: (x) => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  // anticipation (dips back first) + overshoot (passes the target, settles)
  inOutBack: (x) => { const c = 1.25 * 1.525; return x < .5 ? (Math.pow(2 * x, 2) * ((c + 1) * 2 * x - c)) / 2 : (Math.pow(2 * x - 2, 2) * ((c + 1) * (x * 2 - 2) + c) + 2) / 2; },
};
function sceneAt(t) {
  let i = 0;
  for (let k = 0; k < V.scenes.length; k++) if (t >= V.scenes[k].from) i = k;
  const s = V.scenes[i];
  return { s, i, local: t - s.from, left: s.to - t, p: seg(t, s.from, s.to), speak: seg(t, s.start, s.end) };
}
const enterAt = (t, at, dur = 0.45, e = ease.outCubic) => e(clamp((t - at) / dur));
const $ = (q) => document.querySelector(q);
const SVGNS = "http://www.w3.org/2000/svg";
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9%+.]/g, "");
// Exact word start (video time) from Kokoro's timestamps; nth occurrence.
function wt(s, word, nth = 0) {
  const vs = VIS[s.id], target = norm(word);
  let n = 0;
  for (const w of (vs && vs.words) || []) if (norm(w.text) === target && n++ === nth) return s.start + w.t0;
  return s.start;
}
function wend(s, word, nth = 0) {
  const vs = VIS[s.id], target = norm(word);
  let n = 0;
  for (const w of (vs && vs.words) || []) if (norm(w.text) === target && n++ === nth) return s.start + w.t1;
  return s.end;
}
// Seeded PRNG (mulberry32): irregular but identical on every render.
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const S = Object.fromEntries(V.scenes.map((s) => [s.id, s]));

/* ---------- background dressing ---------- */
(function buildSet() {
  const c = $("#clouds");
  [[40, 90, 1], [190, 150, .8], [110, 260, 1.15]].forEach(([x, y, k], i) => {
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("data-x", x); g.setAttribute("data-y", y); g.setAttribute("data-k", k);
    g.innerHTML = `<path d="M -50 0 a 26 26 0 0 1 30 -26 a 34 34 0 0 1 60 6 a 22 22 0 0 1 22 20 Z" fill="#fff" opacity=".85"/>`;
    c.appendChild(g);
  });
  // A mail-sorting rack with envelopes waiting to go out.
  const r = $("#rack");
  let h = `<rect x="0" y="0" width="380" height="164" rx="10" fill="#cfd6d2" stroke="var(--ink)" stroke-width="4"/>`;
  const colors = ["var(--poppy)", "var(--signal)", "var(--steel)", "var(--signal)", "var(--poppy)", "var(--steel)"];
  for (let i = 0; i < 6; i++) {
    const x = 14 + (i % 3) * 120, y = 14 + Math.floor(i / 3) * 74;
    h += `<rect x="${x}" y="${y}" width="112" height="64" rx="5" fill="#b9c3bf" stroke="var(--ink)" stroke-width="3"/>`;
    h += `<g transform="translate(${x + 56},${y + 34}) rotate(${[-6, 4, -2, 7, -4, 3][i]})"><rect x="-36" y="-26" width="72" height="44" rx="3" fill="#fbfbf8" stroke="var(--ink)" stroke-width="3"/><rect x="18" y="-21" width="13" height="15" fill="${colors[i]}" stroke="var(--ink)" stroke-width="2"/></g>`;
  }
  h += `<rect x="0" y="0" width="380" height="164" rx="10" fill="url(#hatchLight)"/>`;
  r.innerHTML = h;
})();

/* ---------- presentation cards (one per scene, read from s.show) ---------- */
const CX = 622, CY = 196, CW = 452, CH = 500;
const frame = (w = CW, h = CH) => `<rect x="12" y="12" width="${w}" height="${h}" rx="22" fill="var(--ink)"/><rect width="${w}" height="${h}" rx="22" fill="var(--card)" stroke="var(--ink)" stroke-width="4.5"/>`;
const esc = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const CARDS = {};
function makeCard(s) {
  const sh = s.show, g = document.createElementNS(SVGNS, "g");
  g.setAttribute("id", "card-" + s.id);
  let h = "";
  if (sh.card === "nametag") {
    // a luggage tag on a string
    h = `<g class="swing"><line x1="226" y1="-120" x2="226" y2="34" stroke="var(--ink)" stroke-width="4"/>
      <path d="M 12 72 L 72 12 H 452 V 412 H 12 Z" transform="translate(12,12)" fill="var(--ink)"/>
      <path d="M 12 72 L 72 12 H 452 V 412 H 12 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="226" cy="50" r="15" fill="var(--paper)" stroke="var(--ink)" stroke-width="4.5"/>
      <rect x="12" y="330" width="440" height="82" fill="url(#hatchLight)"/>
      <text class="lbl" x="56" y="140">Hello, I'm</text>
      <text class="big" x="50" y="290" font-size="168" letter-spacing="-4">${esc(sh.name)}</text>
      <text class="t" x="56" y="384" font-size="36">${esc(sh.role)}</text>
      <g transform="translate(372,112) rotate(8)"><rect x="-38" y="-30" width="76" height="60" rx="4" fill="var(--poppy)" stroke="var(--ink)" stroke-width="4"/><path d="M -24 -16 h 48 v 32 h -48 Z" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/></g></g>`;
  } else if (sh.card === "audiences") {
    const cols = ["var(--steel)", "var(--signal)", "var(--poppy)"];
    const bub = [
      `<text x="0" y="13" text-anchor="middle" font-size="36" font-weight="900" fill="var(--ink)">38</text>`,

  rest: { w: 30, a: -4, b: -2, te: 0, lo: 0, to: 0, tu: 0, bi: 0, cl: 6 },
  MBP:  { w: 27, a: 0.5, b: 0.5, te: 0, lo: 0, to: 0, tu: 0, bi: 0, cl: 2 },
  AI:   { w: 33, a: 8, b: 30, te: .7, lo: .2, to: .8, tu: 0, bi: 0, cl: 3 },
  E:    { w: 38, a: 6, b: 17, te: 1, lo: .7, to: .3, tu: 0, bi: 0, cl: 5 },
  O:    { w: 21, a: 11, b: 24, te: .2, lo: 0, to: .5, tu: 0, bi: 0, cl: 0 },
  U:    { w: 15, a: 6, b: 11, te: 0, lo: 0, to: .2, tu: 0, bi: 0, cl: 0 },
  FV:   { w: 31, a: 5, b: 7, te: 1, lo: 0, to: 0, tu: 0, bi: 1, cl: 3 },
  L:    { w: 31, a: 7, b: 21, te: .8, lo: .2, to: 1, tu: 1, bi: 0, cl: 3 },
  etc:  { w: 31, a: 4, b: 11, te: .9, lo: .6, to: .3, tu: 0, bi: 0, cl: 4 },
};
const mixM = (A, B, k) => { const o = {}; for (const f in A) o[f] = lerp(A[f], B[f], k); return o; };
function mouthAt(t) {
  for (const s of V.scenes) {
    const vs = VIS[s.id];
    if (!vs || !vs.cues || t < s.start - 0.05 || t > s.start + vs.duration + 0.25) continue;
    const lt = t - s.start, cues = vs.cues;
    let i = 0; while (i < cues.length - 1 && lt >= cues[i].t1) i++;
    const c = cues[i], prev = cues[i - 1] || { v: "rest" };
    const k = smooth((lt - c.t0) / 0.065);
    return { m: mixM(MOUTH[prev.v], MOUTH[c.v], k), v: c.v };
  }
  return { m: MOUTH.rest, v: "rest" };
}
function drawMouth(m) {
  const { w, a, b, cl } = m;
  const uc = (-a + 0.25 * cl) / 0.75, lc = (b + 0.25 * cl) / 0.75;
  const d = `M ${-w} ${-cl} C ${-w * .5} ${uc} ${w * .5} ${uc} ${w} ${-cl} C ${w * .5} ${lc} ${-w * .5} ${lc} ${-w} ${-cl} Z`;
  $("#mouthFill").setAttribute("d", d); $("#mouthClipPath").setAttribute("d", d);
  const open = Math.max(0, b + a);
  $("#mouthFill").setAttribute("opacity", open > 2 ? 1 : open / 2);
  $("#mouthLine").setAttribute("d", open > 1.5 ? d : `M ${-w} ${-cl} C ${-w * .5} ${uc} ${w * .5} ${uc} ${w} ${-cl}`);
  $("#mouthLine").setAttribute("stroke-width", lerp(5.5, 4.5, clamp(open / 10)));
  $("#teeth").setAttribute("y", -a - 3); $("#teeth").setAttribute("height", Math.max(0, 10 * m.te));
  $("#teethLo").setAttribute("y", b - 7 * m.lo + 2); $("#teethLo").setAttribute("height", Math.max(0, 7 * m.lo));
  $("#tongue").setAttribute("cy", lerp(b - 3, -a + 7, m.tu)); $("#tongue").setAttribute("rx", w * .6); $("#tongue").setAttribute("ry", 4 + 7 * m.to);
  $("#tongue").setAttribute("opacity", clamp(m.to * 1.5));
  $("#bite").setAttribute("d", `M ${-w * .62} ${b - 1} Q 0 ${b + 3} ${w * .62} ${b - 1}`); $("#bite").setAttribute("opacity", m.bi);
}

/* ---------- body state + follow-through springs ---------- */
function bodyAt(t) {
  const p = poseAt(t), e = emphasisAt(t);
  const sway = 1.3 * Math.sin(TAU * t / 4.3) + 0.6 * Math.sin(TAU * t / 2.7 + 1);
  return { p, e, lean: p.lean + sway, y: -e.bob + 2 * Math.sin(TAU * t / 3.6) - 6 * p.shrug, tilt: p.tilt + e.tilt + 1.6 * Math.sin(TAU * t / 5.1) };
}
const DRV_CACHE = new Map();
function driver(t) {
  const key = Math.round(t * 600);
  let v = DRV_CACHE.get(key);
  if (v === undefined) { const b = bodyAt(t); v = { lean: b.lean, y: b.y, tilt: b.tilt }; DRV_CACHE.set(key, v); }
  return v;
}
// Damped spring driven by the body's acceleration: the bag and scarf lag, overshoot, and settle.
function spring(t, fn, f, z) {
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z), dt = 1 / 60, h = 1 / 60;
  let y = 0;
  for (let i = 1; i <= 75; i++) {
    const tau = i * dt, u = t - tau;
    const acc = (fn(u + h) - 2 * fn(u) + fn(u - h)) / (h * h);
    y += Math.exp(-z * w * tau) * Math.sin(wd * tau) / wd * acc * dt;
  }
  return -y;
}

/* ---------- character rig ---------- */
const dir = (deg) => [-Math.sin(deg * D2R), Math.cos(deg * D2R)];
const L1 = 86, L2 = 80;
function drawArm(id, sx, sy, a1, a2, wrist, hand, hands, env) {
  const d1 = dir(a1), d2 = dir(a1 + a2);
  const ex = sx + L1 * d1[0], ey = sy + L1 * d1[1];
  const wx = ex + L2 * d2[0], wy = ey + L2 * d2[1];
  const d = `M ${sx} ${sy} L ${ex.toFixed(2)} ${ey.toFixed(2)} L ${wx.toFixed(2)} ${wy.toFixed(2)}`;
  const g = $("#" + id);
  g.querySelector(".ink").setAttribute("d", d); g.querySelector(".fill").setAttribute("d", d);
  g.querySelector(".shade").setAttribute("d", d);
  const rot = UPRIGHT[hand] ? wrist : a1 + a2 + wrist;
  g.querySelector(".hand").setAttribute("transform", `translate(${(wx + 4 * d2[0]).toFixed(2)},${(wy + 4 * d2[1]).toFixed(2)}) rotate(${rot.toFixed(2)})`);
  for (const k in hands) hands[k].style.display = k === hand ? "" : "none";
  return { ex, ey, wx, wy };
}
const ROOT = { x: 336, y: 950, k: 1.22 };
window.__rig = {}; // exposed for verification (joint positions)

function renderCharacter(t) {
  const b = bodyAt(t), p = b.p, e = b.e;
  const breath = Math.sin(TAU * t / 3.6);
  $("#charRoot").setAttribute("transform", `translate(${ROOT.x},${ROOT.y}) scale(${ROOT.k})`);
  $("#torso").setAttribute("transform", `translate(0,${b.y.toFixed(2)}) rotate(${b.lean.toFixed(2)} 0 -100)`);
  $("#breath").setAttribute("transform", `translate(0,-100) scale(${1 + 0.006 * breath},${1 + 0.014 * breath}) translate(0,100)`);
  const torso = "M -96 -100 C -104 -180 -100 -262 -66 -292 Q 0 -306 66 -292 C 100 -262 104 -180 96 -100 Q 0 -82 -96 -100 Z";
  $("#jacket").setAttribute("d", torso); $("#torsoClipPath").setAttribute("d", torso);
  const shoulderY = -268 - 3 * breath - 13 * p.shrug;
  // head: tilt around the neck, nod, sink into the shoulders on a shrug, turn toward what Sen looks at
  const look = lookAt(t);
  const tilt = b.tilt + 3 * look.turn;
  $("#head").setAttribute("transform", `translate(${(4 * look.turn).toFixed(2)},${(e.nod + 7 * p.shrug - 2 * breath).toFixed(2)}) rotate(${tilt.toFixed(2)} 0 -310)`);
  $("#face").setAttribute("transform", `translate(${(9 * look.turn).toFixed(2)},${(-3 * Math.max(0, -look.turn)).toFixed(2)})`);
  $("#earL").setAttribute("cx", -114 + 4 * look.turn); $("#earR").setAttribute("cx", 114 + 4 * look.turn);
  $("#cap").setAttribute("transform", `translate(${(3 * look.turn).toFixed(2)},0)`);
  // eyes
  const blink = blinkAt(t);
  document.querySelectorAll(".pupil").forEach((el) => el.setAttribute("transform", `translate(${look.ex.toFixed(2)},${look.ey.toFixed(2)})`));
  document.querySelectorAll(".lid").forEach((el) => el.setAttribute("height", (64 * blink).toFixed(2)));
  [["#eyeL .lidline", -44], ["#eyeR .lidline", 44]].forEach(([q, cx]) => {
    const y = -441 + 62 * blink;
    $(q).setAttribute("d", blink > 0.02 ? `M ${cx - 25} ${y.toFixed(2)} Q ${cx} ${(y + 6 * blink).toFixed(2)} ${cx + 25} ${y.toFixed(2)}` : "");
  });
  // brows: questions, emphasis and shrugs raise them
  const raise = clamp(questionAt(t) + e.brow + 0.9 * p.shrug + 0.6 * bump(t - 0.6, 0.9), 0, 1.3);
  $("#browL").setAttribute("transform", `translate(-44,${(-458 - 12 * raise).toFixed(2)}) rotate(${(-4 - 8 * raise).toFixed(2)})`);
  $("#browR").setAttribute("transform", `translate(44,${(-458 - 12 * raise + 3 * p.shrug).toFixed(2)}) rotate(${(4 + 8 * raise).toFixed(2)})`);
  // mouth
  const mo = mouthAt(t);
  drawMouth(mo.m);
  // arms
  const L = drawArm("armL", -84, shoulderY, p.lU, p.lF, p.lW, p.lHand, HANDS.L);
  const R = drawArm("armR", 84, shoulderY, p.rU, p.rF, p.rW, p.rHand, HANDS.R);
  window.__rig = { t, L, R, shoulderY, mouth: mo.v, lean: b.lean };
  // satchel: hangs from the strap, swings against the body's motion
  const sw = spring(t, (u) => driver(u).lean + 0.8 * driver(u).y, 1.5, 0.18);
  $("#satchel").setAttribute("transform", `translate(-80,-150) rotate(${(0.8 * sw - 0.6 * b.lean).toFixed(2)})`);
  $("#strap").setAttribute("y1", shoulderY - 18); $("#strap2").setAttribute("y1", shoulderY - 18);
  // scarf tails: a chain of segments with follow-through
  const st = spring(t, (u) => driver(u).lean + 0.7 * driver(u).tilt + 1.2 * driver(u).y, 1.9, 0.22);
  const chain = (base, n, len, lag) => {
    let x = 44, y = -294, ang = base;
    const pts = [`M ${x} ${y}`];
    for (let i = 0; i < n; i++) { ang += (i ? 1 : 0.4) * (st * lag * (1 + i * 0.5)) - b.lean * 0.3; const d = dir(ang); x += len * d[0]; y += len * d[1]; pts.push(`L ${x.toFixed(2)} ${y.toFixed(2)}`); }
    return pts.join(" ");
  };
  const ta = chain(-8 + 3 * Math.sin(TAU * t / 2.3), 4, 22, 0.9), tb = chain(14 + 2 * Math.sin(TAU * t / 2.9 + 1), 3, 22, 1.2);
  $("#tailA").setAttribute("d", ta); $("#tailAf").setAttribute("d", ta);
  $("#tailB").setAttribute("d", tb); $("#tailBf").setAttribute("d", tb);
}

/* ---------- cards ---------- */
function renderCards(t) {
  const cur = sceneAt(t);
  V.scenes.forEach((s, i) => {
    const g = CARDS[s.id];
    const on = i === cur.i;
    g.style.display = on ? "" : "none";
    if (!on) return;
    const a0 = cardIn(s);
    const a = ease.outBack(clamp((t - a0) / 0.55));
    const last = i === V.scenes.length - 1;
    const out = last ? 1 : 1 - ease.inCubic(clamp(1 - (s.to - t) / 0.35));
    const vis = clamp((t - a0) / 0.2) * out;
    g.setAttribute("opacity", vis.toFixed(3));
    g.setAttribute("transform", `translate(${(CX - 70 * (1 - a) + 0 * out).toFixed(2)},${(CY + 30 * (1 - a) - 30 * (1 - out)).toFixed(2)}) rotate(${(-5 * (1 - a)).toFixed(2)} 0 ${CH}) scale(${(0.93 * (0.86 + 0.14 * a)).toFixed(4)})`);
    const lt = t - a0, sh = s.show;
    if (sh.card === "nametag") {
      const sw = 7 * Math.exp(-2.4 * Math.max(0, lt)) * Math.sin(TAU * 1.3 * Math.max(0, lt)) + 0.8 * Math.sin(TAU * t / 3);
      g.querySelector(".swing").setAttribute("transform", `rotate(${sw.toFixed(2)} 226 -120)`);
    } else if (sh.card === "audiences") {
      g.querySelectorAll(".person").forEach((el, j) => {
        const x = 78 + j * 148, k = ease.outBack(clamp((t - a0 - 0.15 - j * 0.12) / 0.5));
        el.setAttribute("transform", `translate(${x},${(40 * (1 - k)).toFixed(2)})`); el.setAttribute("opacity", clamp(k * 2).toFixed(3));
        const bk = ease.outBack(clamp((t - wt(s, "takes") - j * 0.18) / 0.45));
        const bub = el.querySelector(".bubble");
        bub.setAttribute("transform", `translate(0,${(170 * (1 - bk)).toFixed(2)}) translate(0,170) scale(${bk.toFixed(3)}) translate(0,-170)`);
        bub.setAttribute("opacity", clamp(bk * 3).toFixed(3));
      });
    } else if (sh.card === "number") {
      const k = ease.outCubic(clamp((t - a0 - 0.1) / 1.1));
      const target = parseFloat(String(sh.value).replace(/[^0-9.]/g, "")) || 0;
      g.querySelector(".num").textContent = sh.value.replace(/[0-9.]+/, String(Math.round(target * k)));
      const len = 420, dk = ease.inOutCubic(clamp((t - wt(s, "number")) / 0.9));
      ["spark", "spark2"].forEach((c) => { const p = g.querySelector("." + c); p.setAttribute("stroke-dasharray", `${len} ${len}`); p.setAttribute("stroke-dashoffset", (len * (1 - dk)).toFixed(1)); });
      g.querySelector(".sparkdot").setAttribute("transform", `translate(410,318) scale(${ease.outBack(clamp((t - wt(s, "number") - 0.8) / 0.4)).toFixed(3)}) translate(-410,-318)`);
    } else if (sh.card === "motion") {
      const P = 1.6, ph = (((t - a0) % P) + P) % P / P;   // the GIF loops
      g.querySelectorAll(".bars rect").forEach((r, j) => {
        const v = 0.25 + 0.7 * Math.pow(Math.sin(Math.PI * clamp(ph * 1.25 - j * 0.06)), 1.4);
        const hgt = 240 * v; r.setAttribute("y", (400 - hgt).toFixed(2)); r.setAttribute("height", hgt.toFixed(2));
      });
      g.querySelector(".loopbar").setAttribute("width", (380 * ph).toFixed(2));
    } else if (sh.card === "guide") {
      const c1 = wt(s, "try") + 0.05, c2 = wt(s, "step") + 0.05;
      // cursor glides to the button and clicks twice
      const m1 = ease.inOutCubic(clamp((t - (c1 - 0.7)) / 0.6));
      const cx = lerp(390, 300, m1), cy = lerp(470, 262, m1);
      const press = Math.max(bump(t - c1, 0.22), bump(t - c2, 0.22));
      g.querySelector(".cursor").setAttribute("transform", `translate(${cx.toFixed(2)},${(cy + 4 * press).toFixed(2)}) scale(${(1 - 0.12 * press).toFixed(3)})`);
      g.querySelector(".btnface").setAttribute("transform", `translate(${(5 * press).toFixed(2)},${(5 * press).toFixed(2)})`);
      const rip = (c) => { const x = clamp((t - c) / 0.45); return x > 0 && x < 1 ? x : 0; };
      const rr = Math.max(rip(c1), rip(c2));
      const rp = g.querySelector(".ripple"); rp.setAttribute("cx", 310); rp.setAttribute("cy", 272); rp.setAttribute("r", (10 + 70 * rr).toFixed(1)); rp.setAttribute("opacity", rr ? (1 - rr).toFixed(3) : 0);
      const step = (t >= c2 ? 3 : t >= c1 ? 2 : 1);
      g.querySelector(".step").textContent = sh.label.replace(/\d+/, String(step));
      g.querySelectorAll(".dots circle").forEach((d, j) => d.setAttribute("fill", j < step ? "var(--steel)" : "var(--card)"));
      g.querySelectorAll(".row").forEach((r, j) => { const k = ease.outBack(clamp((t - c1 - 0.15 - j * 0.12) / 0.4)); r.setAttribute("opacity", clamp(k).toFixed(3)); r.setAttribute("transform", `translate(${40 + 20 * (1 - k)},${336 + j * 46})`); });
    } else if (sh.card === "formats") {
      const open = ease.outBack(clamp((t - wt(s, "deliver") + 0.1) / 0.35));
      g.querySelector(".flap").setAttribute("transform", `scale(1,${(1 - 1.9 * open).toFixed(3)}) translate(0,${(46 * open * 0).toFixed(1)})`);
      g.querySelector(".flap").setAttribute("transform-origin", "0 -46");
      g.querySelector(".seal").setAttribute("opacity", (1 - clamp(open * 2)).toFixed(3));
      g.querySelectorAll(".tile").forEach((el, j) => {
        const k = ease.outBack(clamp((t - wt(s, "deliver") - 0.15 - j * 0.16) / 0.5));
        const x = +el.dataset.x, y = +el.dataset.y;
        el.setAttribute("transform", `translate(${lerp(226 - 93, x, k).toFixed(2)},${lerp(80, y, k).toFixed(2)}) scale(${(0.3 + 0.7 * clamp(k, 0, 1.2)).toFixed(3)})`);
        el.setAttribute("opacity", clamp(k * 4).toFixed(3));
      });
      const fit = bump(t - wt(s, "fits"), 0.5);
      g.querySelectorAll(".tile rect:nth-child(2)").forEach((r) => r.setAttribute("fill", `rgb(255,${Math.round(lerp(255, 222, fit))},${Math.round(lerp(255, 120, fit))})`));
    } else if (sh.card === "files") {
      const at = [wt(s, "anyone") - 0.2, wt(s, "link"), wt(s, "pdf"), wt(s, "video")];
      g.querySelectorAll(".file").forEach((el, j) => {
        const k = ease.outBack(clamp((t - at[j]) / 0.45));
        el.setAttribute("transform", `translate(${el.dataset.x},${(+el.dataset.y + 30 * (1 - k)).toFixed(2)}) scale(${(0.8 + 0.2 * k).toFixed(3)})`);
        el.setAttribute("opacity", clamp(k * 2).toFixed(3));
      });
      const fk = ease.outBack(clamp((t - wt(s, "no") + 0.05) / 0.5));
      const foot = g.querySelector(".foot");
      foot.setAttribute("transform", `translate(226,434) scale(${(0.6 + 0.4 * fk).toFixed(3)}) translate(-226,-434)`); foot.setAttribute("opacity", clamp(fk * 2).toFixed(3));
    } else if (sh.card === "signoff") {
      const bk = ease.inOutCubic(clamp((t - a0 - 0.3) / 0.7));
      g.querySelector(".bar").setAttribute("width", (340 * bk).toFixed(1));
      const ck = ease.outBack(clamp((t - wt(s, "thanks")) / 0.45));
      g.querySelector(".check").setAttribute("transform", `translate(54,36) scale(${ck.toFixed(3)}) translate(-54,-36)`);
    }
  });
}

/* ---------- set + parallax ---------- */
function renderSet(t) {
  const cam = 12 * Math.sin(TAU * t / 16) + 6 * Math.sin(TAU * t / 7.3 + 0.6);
  const camY = 4 * Math.sin(TAU * t / 11);
  $("#bgFar").setAttribute("transform", `translate(${(-cam * 0.3).toFixed(2)},${(-camY * 0.3).toFixed(2)})`);
  $("#bgMid").setAttribute("transform", `translate(${(-cam * 0.65).toFixed(2)},${(-camY * 0.6).toFixed(2)})`);
  $("#floor").setAttribute("transform", `translate(${(-cam * 0.8).toFixed(2)},0)`);
  document.querySelectorAll("#clouds g").forEach((c) => {
    const k = +c.dataset.k, x = ((+c.dataset.x + t * 6 * k) % 420) - 40;
    c.setAttribute("transform", `translate(${x.toFixed(2)},${c.dataset.y}) scale(${k})`);
  });
  // character and cards are the nearest layer: the tracking camera keeps them steady
  $("#cards").setAttribute("transform", `translate(${(-cam * 0.05).toFixed(2)},0)`);
}

window.renderFrame = function (t, info) {
  renderSet(t);
  renderCards(t);
  renderCharacter(t);
  const sc = sceneAt(t);
  $("#tc").textContent = t.toFixed(2) + "s";
  $("#sc").textContent = `${sc.i + 1}/${V.scenes.length} ${sc.s.id} · ${window.__rig.mouth}`;
};

/* ---------- harness: sizing + preview with sound (from templates/video-shell.html) ---------- */
(function () {
  const { width, height, fps, duration } = V;
  const stage = $("#stage");
  document.documentElement.style.setProperty("--w", width + "px");
  document.documentElement.style.setProperty("--h", height + "px");
  if (window.__CAPTURE__) { document.documentElement.classList.add("capture"); window.renderFrame(0, { frame: 0, fps, duration }); return; }
  const fit = () => {
    const k = Math.min(innerWidth / width, innerHeight / height);
    stage.style.transform = `translate(${(innerWidth - width * k) / 2}px, ${(innerHeight - height * k) / 2}px) scale(${k})`;
  };
  addEventListener("resize", fit); fit();
  const audio = $("#narration");
  let hasAudio = false, playing = false, t = 0, last = performance.now();
  audio.addEventListener("canplaythrough", () => { hasAudio = true; });
  audio.addEventListener("error", () => { hasAudio = false; });
  const seek = (x) => { t = clamp(x, 0, duration - 1e-3); if (hasAudio) audio.currentTime = t; window.renderFrame(t, { fps, duration }); };
  window.__seek = seek;
  const toggle = () => {
    playing = !playing;
    if (hasAudio) { if (playing) { audio.currentTime = t; audio.play().catch(() => {}); } else audio.pause(); }
  };
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { toggle(); e.preventDefault(); }
    const step = e.shiftKey ? null : 1 / fps;
    if (e.key === "ArrowRight") { if (step) seek(t + step); else { const n = V.scenes.find((s) => s.from > t + 1e-3); seek(n ? n.from : duration); } }
    if (e.key === "ArrowLeft") { if (step) seek(t - step); else { const p = [...V.scenes].reverse().find((s) => s.from < t - 0.05); seek(p ? p.from : 0); } }
  });
  stage.addEventListener("click", toggle);
  (function tick(now) {
    if (playing) {
      t = hasAudio && !audio.paused ? audio.currentTime : t + (now - last) / 1000;
      if (t >= duration) { t = 0; if (hasAudio) audio.currentTime = 0; }
      window.renderFrame(t, { fps, duration });
    }
    last = now; requestAnimationFrame(tick);
  })(last);
  window.renderFrame(0, { fps, duration });
})();
