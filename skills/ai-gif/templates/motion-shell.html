<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion</title>
<!-- Fonts: load from Google Fonts if you want them; render-gif waits for document.fonts.ready -->
<style>
  :root {
    --bg: #eef1f4;
    --ink: #1f2328;
    --accent: #2f5bea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  /* The stage is always exactly MOTION.width x MOTION.height. In preview it is scaled to fit. */
  #stage {
    position: absolute; left: 0; top: 0;
    width: var(--w); height: var(--h);
    background: var(--bg); color: var(--ink);
    overflow: hidden; transform-origin: 0 0;
    font-family: system-ui, sans-serif;
  }
  #hud {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    font: 12px/1.4 ui-monospace, monospace; color: #ccc;
    background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px;
  }
  .capture #hud { display: none; }
</style>
</head>
<body>
<div id="stage">
  <!-- SCENE: put SVG / DOM / <canvas> here. Everything is positioned by renderFrame(t). -->
  <svg id="scene" viewBox="0 0 1080 1080" width="100%" height="100%">
    <circle id="dot" cx="540" cy="540" r="60" fill="var(--accent)"/>
  </svg>
</div>
<div id="hud">space pause · ←/→ scrub · <span id="tc">0.000</span></div>

<script>
/* ---------- config ---------- */
window.MOTION = { width: 1080, height: 1080, fps: 24, seconds: 4 };

/* ---------- time helpers (all pure functions of t in [0,1)) ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
// Local progress of t inside the window [a, b], clamped to 0..1.
const seg = (t, a, b) => clamp((t - a) / (b - a));
// 0 -> 1 -> 0 across the loop; seamless.
const pingpong = (t) => 1 - Math.abs(1 - 2 * t);
// Smooth periodic wave, seamless when `cycles` is an integer.
const wave = (t, cycles = 1, phase = 0) => 0.5 - 0.5 * Math.cos(TAU * (t * cycles + phase));
const ease = {
  linear: (x) => x,
  inOutCubic: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  outBack: (x) => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  outElastic: (x) => (x === 0 || x === 1) ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
};
const $ = (s) => document.querySelector(s);

/* ---------- the animation: a pure function of t ---------- */
window.renderFrame = function (t) {
  // Example: a dot that orbits once per loop and pulses twice. Replace this.
  const x = 540 + 300 * Math.cos(TAU * t);
  const y = 540 + 300 * Math.sin(TAU * t);
  const r = lerp(50, 80, wave(t, 2));
  const dot = $("#dot");
  dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", r);
  $("#tc").textContent = t.toFixed(3);
};

/* ---------- harness: sizing + preview loop (do not edit) ---------- */
(function () {
  const { width, height, fps, seconds } = window.MOTION;
  const stage = $("#stage");
  document.documentElement.style.setProperty("--w", width + "px");
  document.documentElement.style.setProperty("--h", height + "px");
  if (window.__CAPTURE__) { document.documentElement.classList.add("capture"); window.renderFrame(0); return; }
  const fit = () => {
    const k = Math.min(innerWidth / width, innerHeight / height);
    stage.style.transform = `translate(${(innerWidth - width * k) / 2}px, ${(innerHeight - height * k) / 2}px) scale(${k})`;
  };
  addEventListener("resize", fit); fit();
  let playing = true, t = 0, last = performance.now();
  const step = 1 / (fps * seconds);
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.key === "ArrowRight") { t = (t + step) % 1; window.renderFrame(t); }
    if (e.key === "ArrowLeft") { t = (t - step + 1) % 1; window.renderFrame(t); }
  });
  (function tick(now) {
    if (playing) { t = (t + (now - last) / 1000 / seconds) % 1; window.renderFrame(t); }
    last = now; requestAnimationFrame(tick);
  })(last);
})();
</script>
</body>
</html>
